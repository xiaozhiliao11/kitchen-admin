# 小知了厨房卫士 · ESP32-C3 固件自动编译
# 触发：推送 firmware/ 或本工作流文件；也支持手动运行（Actions → Run workflow）
name: Build ESP32-C3 Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install libraries
        run: |
          arduino-cli lib install "PubSubClient@2.8.0"
          arduino-cli lib install "ArduinoJson@7.4.3"

      - name: Compile (OTA dual-app partition)
        run: |
          cd firmware
          # min_spiffs = Minimal SPIFFS (1.9MB APP with OTA)：双 APP 分区，
          # Update.begin() 才有第二个应用槽位可写入，真 OTA 必需
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs \
            --warnings default \
            --output-dir build-out \
            esp32_backend_demo

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware-bin
          path: firmware/build-out/
          if-no-files-found: error
