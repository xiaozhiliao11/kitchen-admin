    const dayEl = $('#ins-c-day');
    if (dayEl) {
      insState.charts.day = echarts.init(dayEl);
      insState.charts.day.setOption({
        grid: { left: 34, right: 10, top: 14, bottom: 26 },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: d.byDay.map((x) => x.date.slice(5)), ...axis, axisLabel: { color: '#646A73', fontSize: 10 } },
        yAxis: { type: 'value', ...axis, minInterval: 1 },

          type: 'line', smooth: false, symbolSize: 5, data: d.byDay.map((x) => x.count),

      const el = document.getElementById(id);
      if (el) el.innerHTML = '<div class="empty" style="padding-top:60px">图表库加载失败，数据见下方表格</div>';

}

/* ================= 无线测试（实机现场验证） =================
 * 开发者到厨房现场，选设备/日期/测试人员 → 开始记录 → 逐项模拟场景录结果。
 * 失败项多了系统会给整改建议；全部记录留在服务端，手机和电脑看到的是同一份。 */
const wtState = { tests: [], items: [], current: null, advice: [], users: [], pick: '', result: 'ok' };

async function loadTesters() {
  try {
    const r = await api('/api/users');
    wtState.users = (r.users || []).map((u) => u.name || u.account).filter(Boolean);
  } catch (e) { wtState.users = []; }
  if (!wtState.users.length && me) wtState.users = [me.name || me.account || '我'];
  return wtState.users;
}

async function renderTestPage() {
  if (!wtState.items.length) {
    try { const r = await api('/api/tests'); wtState.items = r.items || []; } catch (e) {}
  }
  if (!wtState.users.length) await loadTesters();
  await refreshTests();
}

async function refreshTests() {
  try {
    const r = await api('/api/tests');
    wtState.tests = r.tests || [];
    wtState.items = r.items || wtState.items;
    const running = wtState.tests.find((t) => t.status === 'running');
    if (running && (!wtState.current || wtState.current.id !== running.id)) {
      const d = await api('/api/tests/' + running.id);
      wtState.current = d.test; wtState.advice = d.advice || [];
    }
    if (!running) { wtState.current = null; wtState.advice = []; }
  } catch (e) {}
  drawTestPage();
}

function drawTestPage() {
  const today = new Date().toISOString().slice(0, 10);
  const devOpt = devices.map((d) => '<option value="' + esc(d.id) + '">' + esc(d.id) + (d.name ? ' · ' + esc(d.name) : '') + '</option>').join('');
  const userOpt = wtState.users.map((u) => '<option value="' + esc(u) + '">' + esc(u) + '</option>').join('');
  const cur = wtState.current;

  let html = '<div class="page-head"><h2>无线测试</h2>' +
    '<span class="muted">现场逐项验证：模拟场景 → 记录是否误报/漏报/数值不对 → 系统给整改建议</div>';

  // 新建（没有进行中的测试才显示）
  if (!cur) {
    html += '<div class="card"><h2 style="font-size:15px;margin:0 0 12px">开始一场测试</h2>' +
      '<div class="wt-form">' +
      '<label>设备<select id="wt-dev">' + (devOpt || '<option value="">暂无设备</option>') + '</select></label>' +
      '<label>测试日期<input type="date" id="wt-date" value="' + today + '"></label>' +
      '<label>测试人员<select id="wt-user">' + (userOpt || '<option value="">' + esc((me && (me.name || me.account)) || '我') + '</option>') + '</select></label>' +
      '<button class="primary" id="wt-start">确认开始记录</button>' +
      '</div></div>';
  } else {
    html += '<div class="card"><div class="page-head" style="margin:0 0 10px">' +
      '<h2 style="font-size:15px;margin:0">进行中：' + esc(cur.device) + ' · ' + esc(cur.date) + ' · ' + esc(cur.tester) + '</h2>' +
      '<button id="wt-finish">结束本场测试</button></div>' +
      '<p class="muted" style="margin:0 0 10px">点一个项目 → 现场做这个动作 → 选结果提交。数值可点「取主机读数」直接填，不用手打。</p>' +
      '<div id="wt-live" class="wt-live">正在连接主机实时数据…</div>' +
      '<div class="wt-items">' + wtState.items.map((it) => {
        const done = (cur.items || []).filter((x) => x.item === it.id);
        const bad = done.filter((x) => x.result !== 'ok').length;
        const cls = wtState.pick === it.id ? ' on' : (done.length ? (bad ? ' bad' : ' good') : '');
        return '<div class="wt-item' + cls + '" data-item="' + it.id + '">' +
          '<div class="wt-item-name">' + esc(it.name) + '</div>' +
          '<div class="wt-item-scene">' + esc(it.scene) + '</div>' +
          '<div class="wt-item-meta">' + (done.length ? ('已记 ' + done.length + ' 次' + (bad ? '，问题 ' + bad : '')) : '未记录') + '</div></div>';
      }).join('') + '</div>';

    // 选中项后的记录表单
    const pickInfo = wtState.items.find((x) => x.id === wtState.pick);
    if (pickInfo) {
      html += '<div class="wt-record"><div style="margin-bottom:8px"><b>' + esc(pickInfo.name) + '</b>' +
        '<span class="muted"> · ' + esc(pickInfo.scene) + '</span></div>' +
        '<div class="wt-res">' + [['ok', '正常'], ['noise', '误报'], ['miss', '漏报'], ['value', '数值不对']].map((r) =>
          '<button data-res="' + r[0] + '"' + (wtState.result === r[0] ? ' class="on"' : '') + '>' + r[1] + '</button>').join('') + '</div>' +
        '<div class="wt-form" style="margin-top:8px">' +
        '<label>实测数值/现象<input id="wt-value" placeholder="如 距离 2.1m / 没响 / 响了两声"></label>' +
        '<label>备注<input id="wt-note" placeholder="现场情况、第几次、环境"></label>' +
        '<button id="wt-take" title="把主机此刻的真实读数填进上面的输入框">取主机读数</button>' +
        '<button class="primary" id="wt-add">记下这条</button></div></div>';
    }

    // 本场已记条目
    if ((cur.items || []).length) {
      html += '<div class="card"><h2 style="font-size:15px;margin:0 0 8px">本场记录（' + cur.items.length + ' 条）</h2>' +
        '<table class="wt-table"><colgroup><col style="width:16%"><col style="width:14%"><col style="width:12%"><col style="width:22%"><col style="width:36%"></colgroup>' +
        '<thead><tr><th>时间</th><th>项目</th><th>结果</th><th>实测</th><th>备注</th></tr></thead><tbody>' +
        cur.items.map((x) => '<tr><td>' + fmtLocal(x.at).slice(11) + '</td><td>' + esc((wtState.items.find((i) => i.id === x.item) || {}).name || x.item) +
          '</td><td>' + (x.result === 'ok' ? '<span style="color:var(--green)">正常</span>' : '<span style="color:var(--red)">' + RESULT_NAME(x.result) + '</span>') +
          '</td><td>' + (esc(x.value) || '—') + '</td><td>' + (esc(x.note) || '—') + '</td></tr>').join('') +
        '</tbody></table></div>';
    }

    // 建议
    if (wtState.advice.length) {
      html += '<div class="card"><h2 style="font-size:15px;margin:0 0 8px">整改建议</h2>' +
        wtState.advice.map((a) => '<div class="wt-adv ' + a.level + '"><div><b>' + esc(a.name) + '</b>' +
          '<span class="muted"> · ' + esc(a.detail) + '</span></div><div style="margin-top:4px">' + esc(a.fix) + '</div></div>').join('') + '</div>';
    }
  }

  // 历史
  html += '<div class="card"><h2 style="font-size:15px;margin:0 0 8px">历史测试记录（' + wtState.tests.length + ' 场）</h2>' +
    (wtState.tests.length ? '<table class="wt-table"><colgroup><col style="width:10%"><col style="width:16%"><col style="width:12%"><col style="width:12%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:20%"></colgroup>' +
      '<thead><tr><th>编号</th><th>设备</th><th>日期</th><th>测试人员</th><th>记录数</th><th>问题数</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
      wtState.tests.map((t) => '<tr><td>' + esc(t.id) + '</td><td>' + esc(t.device) + '</td><td>' + esc(t.date) + '</td><td>' + esc(t.tester) +
        '</td><td>' + t.count + '</td><td>' + (t.failCount ? '<span style="color:var(--red)">' + t.failCount + '</span>' : '0') +
        '</td><td>' + (t.status === 'running' ? '<span class="badge">进行中</span>' : '已结束') +
        '</td><td><button class="wt-open" data-id="' + esc(t.id) + '">查看</button> ' +
        '<button class="wt-del" data-id="' + esc(t.id) + '" data-count="' + t.count + '" style="color:var(--red)">删除</button></td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">还没有测试记录。上面选设备、日期、人员，点「确认开始记录」就行。</div>') + '</div>';

  html += '</div>';
  $('#main').innerHTML = html;
  bindTestPage();
  if (cur) startTestLive(cur); else stopTestLive();
}

/* ---- 无线测试：主机实时联动（数值取自主机上报，非手填） ---- */
let wtLiveTimer = null;
const ITEM_SENSOR = {
  presence: '人体存在', dist: '人体距离', gas: '燃气读数(MQ)',
  mic: '声音强度', light: '光照', temp: '温度', humid: '湿度',
  voice: '扬声器', key: '按键(电平)', report: '上报链路', power: '供电与电量',
};

function stopTestLive() { if (wtLiveTimer) { clearInterval(wtLiveTimer); wtLiveTimer = null; } }

function startTestLive(t) {
  stopTestLive();
  const tick = async () => {
    if (view !== 'wt' || !wtState.current || wtState.current.id !== t.id) { stopTestLive(); return; }
    try { wtState.live = await api('/api/tests/' + t.id + '/live'); } catch (e) { wtState.live = { ok: false }; }
    paintTestLive();
  };
  tick();
  wtLiveTimer = setInterval(tick, 2000);
}

function liveNum(v, unit, digits) {
  if (v === null || v === undefined || v === '' || (typeof v === 'number' && !isFinite(v))) return null;
  if (typeof v === 'number') return (digits ? v.toFixed(digits) : String(Math.round(v * 10) / 10)) + (unit || '');
  return String(v);
}

function paintTestLive() {
  const box = $('#wt-live');
  if (!box) return;
  const L = wtState.live || {};
  if (!L.ok) { box.innerHTML = '<span class="muted">实时数据获取失败，稍后自动重试</span>'; return; }
  if (L.online === false) {
    box.innerHTML = '<div class="wt-live-head"><span class="wt-dot off"></span>' +
      '<b>主机离线</b><span class="muted">' + (L.ageSec == null ? '从未上报数据' : '最后上报 ' + L.ageSec + ' 秒前') +
      ' · 联动取不到读数，请先确认主机已联网</span></div>';
    return;
  }
  const s = L.sensors || {};
  const radar = s.radar || {};
  const sht = s.sht || {};
  const cells = [
    ['人体', radar.presence ? '有人' : '无人'],
    ['距离', liveNum(radar.dist, ' cm')],
    ['燃气', liveNum(s.mq)],
    ['温度', liveNum(sht.t, ' ℃', 1)],
    ['湿度', liveNum(sht.h, ' %', 0)],
    ['声音', liveNum(s.mic)],
    ['光照', liveNum(s.light)],
    ['电量', liveNum(L.battery, ' %')],
  ].filter((c) => c[1] !== null);
  box.innerHTML = '<div class="wt-live-head"><span class="wt-dot on"></span><b>主机实时数据</b>' +
    '<span class="muted">' + (L.ageSec == null ? '' : L.ageSec + ' 秒前上报') + ' · FW ' + esc(L.fw || '—') +
    (L.devmode ? ' · 高频采集中（测试期已自动开启）' : '') + '</span></div>' +
    '<div class="wt-live-grid">' + cells.map((c) =>
      '<div class="wt-live-cell"><span class="muted">' + c[0] + '</span><b>' + esc(c[1]) + '</b></div>').join('') + '</div>';
}

/** 把主机此刻读数转成该测试项的实测值文案 */
function takeLiveValue(itemId) {
  const L = wtState.live || {};
  if (!L.ok || L.online === false) return '';
  const s = L.sensors || {}, radar = s.radar || {}, sht = s.sht || {};
  switch (itemId) {
    case 'presence': return radar.presence ? '检测到有人' : '未检测到人';
    case 'dist': return radar.dist != null ? ('距离 ' + radar.dist + 'cm') : '';
    case 'gas': return s.mq != null ? ('MQ ' + s.mq) : '';
    case 'mic': return s.mic != null ? ('声音 ' + s.mic) : '';
    case 'light': return s.light != null ? ('光照 ' + s.light) : '';
    case 'temp': return sht.t != null ? (sht.t.toFixed(1) + '℃') : '';
    case 'humid': return sht.h != null ? (sht.h.toFixed(0) + '%') : '';
    case 'power': return (L.battery != null ? (L.battery + '%') : '') + (L.state ? (' · ' + L.state) : '');
    case 'report': return L.ageSec != null ? ('心跳 ' + L.ageSec + ' 秒前') : '';
    default: return '';
  }
}

function RESULT_NAME(r) {
  return { ok: '正常', noise: '误报', miss: '漏报', value: '数值不对' }[r] || r;
}

function bindTestPage() {
  const start = $('#wt-start');
  if (start) start.onclick = async () => {
    const device = $('#wt-dev').value, date = $('#wt-date').value, tester = $('#wt-user').value;
    if (!device) return alert('请选择设备');
    start.disabled = true;
    try {
      const r = await api('/api/tests', { method: 'POST', body: JSON.stringify({ device, date, tester }) });
      wtState.current = r.test; wtState.items = r.items || wtState.items; wtState.advice = [];
      if (r.warn) alert(r.warn);
      drawTestPage();
    } catch (e) { start.disabled = false; alert('创建失败：' + (e.message || e)); }
  };

  document.querySelectorAll('.wt-item').forEach((el) => {
    el.onclick = () => { wtState.pick = el.dataset.item; wtState.result = 'ok'; drawTestPage(); };
  });
  document.querySelectorAll('.wt-res button').forEach((b) => {
    b.onclick = () => { wtState.result = b.dataset.res; drawTestPage(); };
  });

  const take = $('#wt-take');
  if (take) take.onclick = () => {
    const v = takeLiveValue(wtState.pick);
    if (!v) return alert('主机当前离线或该项没有可读数值，请确认主机联网后重试');
    $('#wt-value').value = v;
  };

  const add = $('#wt-add');
  if (add) add.onclick = async () => {
    if (!wtState.current) return;
    add.disabled = true;
    try {
      const r = await api('/api/tests/' + wtState.current.id + '/items', {
        method: 'POST',
        body: JSON.stringify({ item: wtState.pick, result: wtState.result, value: $('#wt-value').value, note: $('#wt-note').value }),
      });
      wtState.current = r.test; wtState.advice = r.advice || [];
      wtState.pick = ''; wtState.result = 'ok';
      drawTestPage();
    } catch (e) { add.disabled = false; alert('记录失败：' + (e.message || e)); }
  };

  const fin = $('#wt-finish');
  if (fin) fin.onclick = async () => {
    if (!confirm('结束本场测试？结束后不能再追加记录。')) return;
    try {
      const r = await api('/api/tests/' + wtState.current.id + '/finish', { method: 'POST', body: '{}' });
      wtState.current = null; wtState.advice = r.advice || [];
      await refreshTests();
    } catch (e) { alert('结束失败：' + (e.message || e)); }
  };

  document.querySelectorAll('.wt-del').forEach((b) => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const id = b.dataset.id;
      const n = Number(b.dataset.count || 0);
      const sure = confirm('删除这场测试记录？\n\n编号：' + id + '\n记录条数：' + n + ' 条\n\n删除后不能恢复。');
      if (!sure) return;
      b.disabled = true;
      try {
        await api('/api/tests/' + id + '?confirm=1', { method: 'DELETE' });
        if (wtState.current && wtState.current.id === id) { wtState.current = null; wtState.advice = []; }
        await refreshTests();
      } catch (err) { b.disabled = false; alert('删除失败：' + (err.message || err)); }
    };
  });

  document.querySelectorAll('.wt-open').forEach((b) => {
    b.onclick = async () => {
      try {
        const r = await api('/api/tests/' + b.dataset.id);
        const rows = (r.test.items || []).map((x) => '<tr><td>' + fmtLocal(x.at) + '</td><td>' +
          esc((r.allItems.find((i) => i.id === x.item) || {}).name || x.item) + '</td><td>' + RESULT_NAME(x.result) +
          '</td><td>' + (esc(x.value) || '—') + '</td><td>' + (esc(x.note) || '—') + '</td></tr>').join('');
        $('#main').innerHTML = '<div class="page-head"><h2>测试详情 ' + esc(r.test.id) + '</h2>' +
          '<button id="wt-del2" style="color:var(--red)">删除本场</button>' +
          '<button id="wt-back">返回列表</button></div>' +
          '<div class="card"><p class="muted">' + esc(r.test.device) + ' · ' + esc(r.test.date) + ' · ' + esc(r.test.tester) +
          ' · ' + (r.test.items || []).length + ' 条</p>' +
          (rows ? '<table class="wt-table"><colgroup><col style="width:18%"><col style="width:18%"><col style="width:12%"><col style="width:22%"><col style="width:30%"></colgroup><thead><tr><th>时间</th><th>项目</th><th>结果</th><th>实测</th><th>备注</th></tr></thead><tbody>' + rows + '</tbody></table>' : '<div class="empty">本场没有记录</div>') +
          '</div>' + ((r.advice || []).length ? '<div class="card"><h2 style="font-size:15px">整改建议</h2>' +
          r.advice.map((a) => '<div class="wt-adv ' + a.level + '"><b>' + esc(a.name) + '</b><span class="muted"> · ' + esc(a.detail) + '</span><div>' + esc(a.fix) + '</div></div>').join('') + '</div>' : '');
        $('#wt-back').onclick = () => renderTestPage();
        $('#wt-del2').onclick = async () => {
          if (!confirm('删除本场测试记录？删除后不能恢复。')) return;
          try {
            await api('/api/tests/' + r.test.id + '?confirm=1', { method: 'DELETE' });
            if (wtState.current && wtState.current.id === r.test.id) { wtState.current = null; wtState.advice = []; }
            await renderTestPage();
          } catch (err) { alert('删除失败：' + (err.message || err)); }
        };
      } catch (e) { alert('读取失败：' + (e.message || e)); }
    };
  });
}

/* ── 客户端升级检查 ──
 * 壳（电脑端 / 安卓端）在 UA 里带上自己的版本号，页面拿它和后台发布版本比对。
 * 纯浏览器访问没有版本标识，不提示。 */
function cmpVer(a, b) {
  const A = String(a).split('.').map(Number), B = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(A.length, B.length); i++) {
    const x = A[i] || 0, y = B[i] || 0;
    if (x !== y) return x - y;
  }
  return 0;
}

async function checkUpdate() {
  const ua = navigator.userAgent || '';
  const pc = ua.match(/XZLKitchenPC\/([\d.]+)/);
  const ad = ua.match(/XZLKitchenApp\/([\d.]+)/);
  const cur = pc ? pc[1] : (ad ? ad[1] : '');
  if (!cur) return;                       // 普通浏览器：不提示
  const platform = pc ? 'windows' : 'android';
  const r = await api('/api/app/version?platform=' + platform).catch(() => null);
  const rel = r && r.release && r.release[platform];
  const bar = $('#upbar');
  if (!bar) return;
  if (!rel || !rel.version || !rel.url) { bar.style.display = 'none'; return; }

  // 已经不比当前版本新 → 收起提示，并清掉「已忽略」记录，避免下次真更新时被旧标记挡住
  if (cmpVer(rel.version, cur) <= 0) {
    bar.style.display = 'none';
    if (localStorage.getItem('xz_up_dismiss') === rel.version) localStorage.removeItem('xz_up_dismiss');
    return;
  }
  // 用户点过「稍后」的同一版本，本次不再弹（刷新多少次都不弹），换版本才会再提醒
  if (localStorage.getItem('xz_up_dismiss') === rel.version) { bar.style.display = 'none'; return; }

  $('#upbar-text').textContent = '发现新版本 v' + rel.version + '（当前 v' + cur + '）' +
    (canAutoUpdate ? '' : '　·　当前程序版本较老，请下载后手动安装一次，之后就能自动更新');
  bar.style.display = 'flex';
  const absUrl = (() => { try { return new URL(rel.url, location.href).toString(); } catch (e) { return rel.url; } })();
  // 1.0.7 起壳才具备「自动下载+静默安装」，更老的壳不认识这个协议，会弹系统「找不到应用」
  const canAutoUpdate = !!pc && cmpVer(cur, '1.0.7') >= 0;
  $('#upbar-go').textContent = canAutoUpdate ? '立即下载' : '下载并手动安装';
  $('#upbar-go').onclick = () => {
    if (canAutoUpdate) {
      window.open('xzl-update://install?url=' + encodeURIComponent(absUrl), '_blank');
    } else {
      window.open(absUrl, '_blank');       // 老壳/手机：交给系统浏览器下载，装一次后即可自动更新
    }
  };
  $('#upbar-later').onclick = () => {
    localStorage.setItem('xz_up_dismiss', rel.version);
    bar.style.display = 'none';
  };
  // 装完新版后，点一下这个按钮立刻复核；若确实已是新版本，提示自动消失
  const recheck = $('#upbar-recheck');
  if (recheck) recheck.onclick = async () => {
    const cur2 = ((navigator.userAgent || '').match(pc ? /XZLKitchenPC\/([\d.]+)/ : /XZLKitchenApp\/([\d.]+)/) || [])[1] || '';
    if (cur2 && cmpVer(rel.version, cur2) <= 0) {
      localStorage.removeItem('xz_up_dismiss');
      bar.style.display = 'none';
      alert('已是最新版本 v' + cur2 + '，提示已收起');
    } else {
      alert('当前程序版本仍是 v' + (cur2 || cur) + '。\n请运行刚下载的安装包完成安装，装好后点「我已更新」复核。');
    }
  };
}

/* 云端没有持久盘：未配置 GIT_DATA_REPO 时，平台重启/重建容器会把 data/ 清空。
   这里必须显式警告——否则用户会看到「保存成功，过一会又变回去」，还以为是功能 BUG。 */
function warnIfNoPersistence(h) {
  const p = h && h.persist;
  if (!p) return;
  const bk = p.backup || {};
  // 1) 备份令牌失效/恢复失败：数据可能已经丢过一次，必须最高优先级提示
  if (p.gitBackup && bk.restoreFailed) {
    showPersistAlert('⚠️ 数据备份恢复失败：服务器从备份仓库读取数据时出错（GitHub 令牌可能已过期或被截断）。' +
      '本次启动用的是空数据，请重新生成令牌并更新 GIT_DATA_REPO 后重启。', '#fdecea', '#f3b4b0', '#8a1c14');
    return;
  }
  // 2) 完全没配置持久化：本地文件在容器重建时会清空
  if (p.gitBackup) return;
  const host = location.hostname;
  const local = host === 'localhost' || host === '127.0.0.1' || /^192\.168\./.test(host);
  if (local) return;
  showPersistAlert('当前云端未开启数据持久化：新增账号、修改或删除设备在服务器重启后会丢失。' +
    '请在部署平台把私有数据仓库地址配置到环境变量 GIT_DATA_REPO 后重启一次。', '#fff4e5', '#f0c48a', '#8a4b00');
}

function showPersistAlert(msg, bg, border, fg) {

  bar.style.cssText = 'position:sticky;top:0;z-index:99;background:' + bg + ';border-bottom:1px solid ' + border +
    ';color:' + fg + ';font-size:13px;line-height:1.6;padding:8px 14px;display:flex;gap:10px;align-items:flex-start';
  bar.innerHTML = '<span style="flex:1">' + msg + '</span>' +
    '<button style="background:none;border:1px solid ' + border + ';color:' + fg +
    ';border-radius:6px;padding:2px 10px;cursor:pointer">知道了</button>';
  document.body.insertBefore(bar, document.body.firstChild);
  const c = bar.querySelector('button');

  try {

    me = await r.json();
  } catch (e) { /* 服务不可达：继续加载，顶部状态会显示服务离线 */ }
  renderUserBadge();
  applyPlatformUI();
  // 并行发起：健康检查 / 设备列表 / 固件库 / 事件预热，互不阻塞，首屏更快
  const [h] = await Promise.all([
    api('/api/health').catch(() => null),
    loadDevices(),            // 内部会渲染首页（view === 'devices'）
    loadFirmwares(),
    api('/api/events?limit=200').catch(() => ({ events: [] })).then((evs) => {
      window.__eventsCache = {};
      (evs.events || []).forEach((e) => { if (!window.__eventsCache[e.device]) window.__eventsCache[e.device] = []; window.__eventsCache[e.device].push(e); });
    })
  ]);
  if (h) {
    setPill('srv', true); setPill('mqt', !!h.mqtt);
    // 版本号以服务端为准：一处改版，页面自动跟上
    const verEl = $('#app-ver');
    if (verEl && h.version) verEl.textContent = 'v' + h.version;
    warnIfNoPersistence(h);
  }
  else setPill('srv', false);
  connectWS();
  checkUpdate();          // 仅电脑端 / 安卓端壳内生效（UA 带版本号才有结果）
}
boot();
setInterval(loadDevices, 15000);
// 手机切后台/锁屏后 WS 会断、页面数据会凝固：回到前台立刻拉一次真实状态并补连实时通道
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !me) return;
  updateSyncTexts();
  loadDevices();
  if (!ws || ws.readyState === WebSocket.CLOSED) connectWS();
});
</script>
</body>
</html>
