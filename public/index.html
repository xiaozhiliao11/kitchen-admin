<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZILO 管理后台</title>
<style>
  :root{
    --bg:#F2F4F7; --card:#FFFFFF; --line:#DEE3E8; --text:#1F2329; --sub:#646A73;
    --blue:#2F6FE4; --blue-l:#EAF1FE; --green:#16A34A; --green-l:#E8F7EE;
    --red:#DC2626; --red-l:#FDEAEA; --amber:#D97706; --amber-l:#FEF4E5; --gray:#6B7280; --gray-l:#F3F4F6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;color:#1E4E8C;font-weight:700;white-space:nowrap}
  .topnav{display:flex;gap:6px;flex-wrap:wrap}
  .navbtn{padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub);background:var(--gray-l);border:1px solid transparent;user-select:none}
  .navbtn:hover{color:var(--blue)}
  .navbtn.on{background:var(--blue-l);color:var(--blue);font-weight:600;border-color:#BBD3F6}
  .hdr-status{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap;margin-left:auto}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--gray-l);color:var(--gray)}
  .pill.ok{background:var(--green-l);color:var(--green)} .pill.bad{background:var(--red-l);color:var(--red)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block}
  .dot.ok{background:var(--green)} .dot.bad{background:var(--red)} .dot.warn{background:var(--amber)} .dot.live{background:var(--red);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .wrap{padding:16px 18px}
  main{max-width:1180px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h3{font-size:14px;margin-bottom:10px;color:#1E4E8C}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kv{background:var(--gray-l);border-radius:8px;padding:8px 10px}
  .kv .k{font-size:11px;color:var(--sub)} .kv .v{font-size:15px;font-weight:600;margin-top:2px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;padding:3px 10px;border-radius:14px;background:var(--gray-l);color:var(--gray)}
  .chip.ok{background:var(--green-l);color:var(--green)} .chip.err{background:var(--red-l);color:var(--red)} .chip.warn{background:var(--amber-l);color:var(--amber)}
  button{font-size:13px;padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  button.danger{background:var(--red);border-color:var(--red);color:#fff}
  button:disabled{opacity:.55;cursor:not-allowed}
  input,select,textarea{font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fitem label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
  .events{list-style:none}
  .events li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;display:flex;gap:8px;align-items:baseline}
  .events li:last-child{border-bottom:none}
  .ev-lv{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--gray-l);color:var(--gray);white-space:nowrap}
  .ev-lv.info{background:var(--green-l);color:var(--green)} .ev-lv.warn{background:var(--amber-l);color:var(--amber)} .ev-lv.err,.ev-lv.critical{background:var(--red-l);color:var(--red)}
  .ev-time{font-size:11px;color:var(--gray);white-space:nowrap}
  .problist{list-style:none}
  .problist li{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:9px 12px;margin-bottom:8px}
  .problist li.pass{border-left-color:var(--green)}
  .pb-head{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .code{background:var(--red-l);color:var(--red);font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
  .pb-body{margin-top:5px;font-size:12.5px;color:var(--text);line-height:1.55}
  .pb-sub{color:var(--sub);font-size:12px}
  .ai-box{background:var(--blue-l);border:1px solid #BBD3F6;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:8px}
  .live-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .devmode-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--red-l);border:1px solid #F3C1C1;border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .devmode-bar.off{background:var(--gray-l);border-color:var(--line)}
  .muted{color:var(--sub);font-size:12px}
  .countdown{font-size:13px;font-weight:700;color:var(--red)}
  .note{background:var(--amber-l);border:1px solid #F5D9A8;border-radius:8px;padding:8px 12px;font-size:12px;color:#7C5A10;margin-bottom:10px}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .topbar h2{font-size:17px}
  .sync-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 12px;border-radius:18px;background:var(--gray-l);color:var(--gray);font-weight:600}
  .sync-tag.live{background:var(--red-l);color:var(--red)}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:7px 14px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;font-size:13px}
  .tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
  /* 全部设备主页 */
  .page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .page-head h2{font-size:18px}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .dev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .dev:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(47,111,228,.08)}
  .dev-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .dev-id{font-weight:700;font-size:15px}
  .dev-name{font-size:12px;color:var(--sub);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dev-user{display:flex;gap:10px;font-size:11px;color:var(--gray);margin-top:5px;flex-wrap:wrap}
  .badge{font-size:11px;padding:1px 8px;border-radius:12px;background:var(--gray-l);color:var(--gray);white-space:nowrap}
  .badge.live{background:var(--red-l);color:var(--red);font-weight:600}
  .badge.state{background:var(--amber-l);color:var(--amber)}
  .badge.state.idle{background:var(--green-l);color:var(--green)}
  .badge.state.off{background:var(--gray-l);color:var(--gray)}
  .dev-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .dev-sync{font-size:11px;color:var(--gray);margin-top:6px}
  .empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:13px}
  /* 固件/烧录页 */
  .fwtbl{width:100%;border-collapse:collapse;font-size:13px}
  .fwtbl th,.fwtbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  .fwtbl th{color:var(--sub);font-size:12px;font-weight:600;background:var(--gray-l)}
  .logbox{background:#101418;color:#7ee787;border-radius:10px;padding:12px 14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;max-height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
  .drop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .grow{flex:1;min-width:180px}
  /* ===== 手机端适配（窄屏 < 760px） ===== */
  @media (max-width:760px){
    header{gap:10px;padding:10px 12px}
    .hdr-status{margin-left:0;width:100%}
    .wrap{padding:12px 10px}
    .navbtn{flex:1;text-align:center;padding:8px 4px;font-size:12px}
    .frow{grid-template-columns:1fr}
    .home-grid{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
    .topbar{gap:8px}
    .topbar h2{width:100%}
    button{padding:8px 12px}
    .tabs{overflow-x:auto;flex-wrap:nowrap}
    .tab{white-space:nowrap;padding:8px 12px}
    .fwtbl{display:block;overflow-x:auto;white-space:nowrap}
    .logbox{max-height:200px;font-size:11px}
    .events li{flex-wrap:wrap}
    .page-head h2{font-size:16px}
    .dev-user{font-size:11px}
  }
  .wr{background:var(--green-l);border:1px solid #B7E2C3;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#14532d;margin-bottom:10px}
  /* ================= V54 UI 统一规范（覆盖层，不改变任何功能） ================= */
  body{line-height:1.6;letter-spacing:.01em}
  h2{line-height:1.4}
  .card{padding:16px 18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card h3{font-size:14px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);color:#17355F}
  .card h3 .hint{font-weight:400;font-size:12px;color:var(--sub);margin-left:6px}
  .muted{line-height:1.6}
  .row{align-items:center;gap:12px}
  button{min-height:36px;transition:background .12s,border-color .12s,box-shadow .12s;font-weight:500}
  button:hover{border-color:var(--blue);box-shadow:0 1px 3px rgba(47,111,228,.15)}
  button.primary:hover{background:#2A5FC7;border-color:#2A5FC7}
  button.danger:hover{background:#B91C1C;border-color:#B91C1C}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  input,select,textarea{min-height:38px;transition:border-color .12s,box-shadow .12s}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,228,.12);outline:none}
  .fitem{margin-bottom:10px}
  .fitem label{font-size:12px;color:var(--sub);margin-bottom:5px}
  .frow{row-gap:12px}
  .kv{padding:9px 12px}
  .kv .v{font-size:14px}
  .fwtbl th{padding:10px 12px}
  .fwtbl td{padding:10px 12px;vertical-align:middle}
  .tab{transition:color .12s,background .12s}
  .tab:hover{color:var(--blue);background:var(--blue-l)}
  .note{line-height:1.6}
  .topbar h2,.page-head h2{display:flex;align-items:center;gap:8px}
  .events li{line-height:1.5}
  .pb-body{line-height:1.6}
  .logbox{font-size:12.5px;line-height:1.7}
  /* 移动端（窄屏 < 760px）排版优化 */
  @media (max-width:760px){
    body{font-size:14px}
    header{padding:10px 12px;gap:8px}
    header h1{font-size:15px}
    .navbtn{min-height:40px}
    .card{padding:14px 12px;border-radius:10px;margin-bottom:12px}
    .card h3{font-size:13.5px;margin-bottom:10px;padding-bottom:6px}
    .topbar{margin-bottom:10px}
    .topbar h2,.page-head h2{font-size:16px;width:100%;margin-bottom:2px}
    .page-head .muted{width:100%}
    .page-head{margin-bottom:12px}
    button{min-height:42px;padding:8px 14px;font-size:13px}
    input,select,textarea{min-height:42px;font-size:14px;padding:8px 10px}
    .fitem label{font-size:12.5px}
    .frow{gap:6px 10px}
    .grid{gap:8px}
    .kv{padding:7px 9px}
    .kv .v{font-size:13.5px}
    .kv .k{font-size:11px}
    .fwtbl th,.fwtbl td{padding:8px 10px;font-size:12px}
    .tab{padding:9px 12px;font-size:13px}
    .events li{padding:8px 0;font-size:12.5px}
    .note{padding:9px 12px;font-size:12.5px}
    .muted{font-size:12.5px}
    .home-grid{gap:10px}
    .dev{padding:12px 12px}
    .dev-id{font-size:14px}
    .logbox{max-height:180px}
    .row{gap:10px}
    .sync-tag{font-size:12px;padding:5px 10px}
    .devmode-bar{padding:10px 12px;gap:10px}
  }
  /* 传感器健康网格（V55） */
  .sensor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .sensor-cell{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--gray-l);display:flex;flex-direction:column;gap:3px}
  .sensor-cell.ok{border-color:#B7E2C3;background:var(--green-l)}
  .sensor-cell.warn{border-color:#F5D9A8;background:var(--amber-l)}
  .sensor-cell.err{border-color:#F3C1C1;background:var(--red-l)}
  .sensor-cell .s-name{font-size:12.5px;color:var(--sub);font-weight:600}
  .sensor-cell .s-val{font-size:14px;font-weight:700;color:var(--text);word-break:break-all}
  .sensor-cell .s-st{font-size:11.5px;font-weight:600;color:var(--gray)}
  .sensor-cell.ok .s-st{color:var(--green)}
  .sensor-cell.warn .s-st{color:var(--amber)}
  .sensor-cell.err .s-st{color:var(--red)}
  /* 自检进展（V55） */
  .diag-progress{list-style:none;margin-top:10px}
  .diag-progress li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--sub)}
  .diag-progress li.run{background:var(--blue-l);color:var(--blue);font-weight:600}
  .diag-progress li.ok{color:var(--green);font-weight:600}
  .diag-progress li.err{color:var(--red);font-weight:600}
  .diag-progress li .dp-ic{width:18px;text-align:center}
  /* 电源控制按钮（V56） */
  .dev-ops{display:flex;gap:6px;margin-top:8px}
  .devop{flex:1;padding:7px 0;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);cursor:pointer;min-height:34px}
  .devop:hover{border-color:var(--blue);color:var(--blue)}
  .devop:disabled{opacity:.5}
  @media (max-width:760px){.sensor-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.sensor-cell{padding:8px 10px}.sensor-cell .s-val{font-size:13px}.devop{min-height:42px}}
  /* 账号登录 / 账号管理 */
  .hdr-user{display:none;align-items:center;gap:6px;margin-left:10px}
  .btn-sm{padding:5px 10px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);cursor:pointer;min-height:30px}
  .btn-sm:hover{border-color:var(--blue);color:var(--blue)}
  .btn-sm.danger:hover{border-color:var(--red);color:var(--red)}
  .login-card{background:#fff;border-radius:14px;padding:30px 28px;max-width:360px;width:90%;box-sizing:border-box;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .login-card .lr{margin-bottom:12px}
  .login-card .lr label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
  .login-card .lr input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:16px;border:1px solid #ccd3e0;border-radius:8px}
  .u-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  .u-row:last-child{border-bottom:none}
  .u-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--gray-l);color:var(--sub)}
  .u-tag.admin{background:var(--blue-l);color:var(--blue);font-weight:600}
  .u-tag.paused{background:#fdeaea;color:var(--red)}
  .u-ops{margin-left:auto;display:flex;gap:6px}
  .u-new{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:end}
  .u-new .lr{flex:1;min-width:130px}
  .u-new .lr label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .u-new .lr input{width:100%;box-sizing:border-box;padding:8px 10px;font-size:14px;border:1px solid #ccd3e0;border-radius:8px}
  .ver{font-size:12.5px; font-weight:500; color:#8A908D; margin-left:9px; vertical-align:middle; letter-spacing:.02em}

/* 客户端升级提示条：只在电脑端/安卓端壳里出现（UA 带版本号），纯浏览器不打扰 */
.upbar{display:none;align-items:center;gap:12px;flex-wrap:wrap;background:#fffbeb;border-bottom:1px solid #fcd34d;
  padding:9px 18px;font-size:13px;color:#92400e;position:sticky;top:0;z-index:6}
.upbar button{background:#b45309;color:#fff;border:0;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer}
.upbar .later{background:transparent;color:#92400e;text-decoration:underline;padding:6px 4px}

/* ===== 用户数据库 ===== */
.ins-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ins-head h2{font-size:17px;margin:0}
.ins-head span{font-size:12.5px;color:var(--sub)}
.ins-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.ins-kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ins-kpi .k{font-size:12px;color:var(--sub)}
.ins-kpi .v{font-size:22px;font-weight:600;line-height:1.3;margin-top:2px}
.ins-kpi .u{font-size:12px;color:var(--sub);margin-left:3px;font-weight:400}
.ins-charts{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.ins-chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ins-chart h3{font-size:13.5px;font-weight:600;margin:0 0 2px}
.ins-chart p{font-size:12px;color:var(--sub);margin:0 0 8px}
.ins-canvas{width:100%;height:210px}
.ins-seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ins-seg button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;
  padding:6px 14px;font-size:13px;cursor:pointer}
.ins-seg button.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue);font-weight:600}
.ins-tablewrap{overflow-x:auto}
table.ins-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.ins-table th{text-align:left;font-weight:600;color:var(--sub);font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line)}
.ins-table td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ins-table tr:last-child td{border-bottom:0}
.ins-h{display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:2px 7px;
  border-radius:6px;font-size:12px;font-weight:600}
.ins-h.good{background:var(--green-l);color:var(--green)}
.ins-h.warn{background:var(--amber-l);color:var(--amber)}
.ins-h.bad{background:var(--red-l);color:var(--red)}
.ins-sug{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ins-sug:last-child{border-bottom:0}
.ins-sug .bar{width:3px;border-radius:2px;flex:0 0 3px}
.ins-sug .bar.high{background:var(--red)} .ins-sug .bar.mid{background:var(--amber)} .ins-sug .bar.info{background:var(--blue)}
.ins-sug .body{flex:1;min-width:0}
.ins-sug .t{font-size:13.5px;font-weight:600;margin-bottom:3px}
.ins-sug .b{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:3px}
.ins-sug .w{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:6px}
.ins-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ins-btn{border:1px solid var(--blue);background:var(--blue-l);color:var(--blue);border-radius:8px;
  padding:5px 12px;font-size:12.5px;cursor:pointer}
.ins-btn.ghost{border-color:var(--line);background:var(--card);color:var(--sub)}
.ins-hint{font-size:12.5px;color:var(--amber);background:var(--amber-l);border-radius:8px;padding:8px 10px;line-height:1.6}
.ins-gap{font-size:12.5px;color:var(--sub);line-height:1.8}
.ins-gap code{background:var(--gray-l);padding:1px 5px;border-radius:4px;font-size:12px}

.ins-lib .row{display:flex;gap:8px;border-bottom:1px dashed var(--line);padding:5px 0}
.ins-lib .row:last-child{border:0}

@media(min-width:768px){
  .ins-kpis{grid-template-columns:repeat(4,1fr)}

}

/* 手机端：串口相关功能一律不显示（CSS 兜底，防止脚本时机问题） */
body.is-mobile .navbtn[data-view="flash"],
body.is-mobile .navbtn[data-view="debug"] { display: none !important; }

/* 无线测试 */
.wt-form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.wt-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#646A73}
.wt-form select,.wt-form input{min-width:150px;padding:7px 10px;border:1px solid #e5e6eb;border-radius:8px;font-size:14px;background:#fff}

@media(max-width:640px){.wt-items{grid-template-columns:repeat(2,1fr)}}

.wt-res button.on{background:#16a34a;color:#fff;border-color:#16a34a}
.wt-adv{padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:13px}
.wt-adv.high{background:#fef2f2;border-left:3px solid #dc2626}
.wt-adv.mid{background:#fffbeb;border-left:3px solid #d97706}
.wt-live{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#f8fafc}
.wt-live-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.wt-dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.wt-dot.off{background:#dc2626}
.wt-live-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.wt-live-cell{background:#fff;border:1px solid #eef1f5;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.wt-live-cell span{font-size:11px}
.wt-live-cell b{font-size:13px}
@media (max-width:520px){.wt-live-grid{grid-template-columns:repeat(2,1fr)}}
.wt-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.wt-table th,.wt-table td{padding:8px 6px;border-bottom:1px solid #f2f3f5;text-align:left;word-break:break-all}
.wt-table th{color:#86909c;font-weight:500;font-size:12px}
</style>
</head>
<body>
<div class="upbar" id="upbar">
  <span id="upbar-text"></span>
  <button id="upbar-go">立即下载</button>
  <button class="later" id="upbar-recheck">我已更新</button>
  <button class="later" id="upbar-later">稍后</button>
</div>
<header>
  <h1>ZILO 管理后台<span class="ver" id="app-ver">v1.1.2</span></h1>
  <nav class="topnav" id="topnav">
    <div class="navbtn on" data-view="devices">全部设备</div>
    <div class="navbtn" data-view="insights">用户数据库</div>
    <div class="navbtn" data-view="flash">程序烧录</div>
    <div class="navbtn" data-view="wt">无线测试</div>
    <div class="navbtn" data-view="ai">AI 与工作流</div>
    <div class="navbtn" data-view="debug">有线调试</div>
  </nav>
  <div class="hdr-status">
    <span class="pill" id="srv"><span class="dot" id="srv-dot"></span>服务</span>
    <span class="pill" id="mqt"><span class="dot" id="mqt-dot"></span>MQTT</span>
    <span class="pill" id="wss"><span class="dot" id="wss-dot"></span>实时通道</span>
  </div>
  <div class="hdr-user" id="hdr-user"></div>
</header>

<div class="wrap"><main id="main"><div class="empty">正在加载…</div></main></div>

<script>
/* ================= 全局状态 ================= */
let view = 'devices';        // devices | flash | ai | debug | detail
let devices = [];
let selId = null;
let cur = null;              // 当前设备详情
let ws = null;
let countdownTimer = null;
let devmodeEnd = 0;
let settingsCache = null;
let firmwares = [];
let globalWfVersion = null;  // 全局工作流版本（AI 与工作流页保存后 +1）

const $ = (s) => document.querySelector(s);
const fmtTime = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', { hour12: false });
};
const fmtCount = (ts) => {
  const s = Math.max(0, Math.round((ts - Date.now()) / 1000));
  const m = Math.floor(s / 60), ss = s % 60;
  return m + '分' + (ss < 10 ? '0' : '') + ss + '秒';
};
/* 在线状态的真实性靠「多久没同步」体现：设备 60 秒一次心跳，
   超过 70 秒没更新就不该再让用户看到纯「在线」 */
const fmtAgo = (iso) => {
  if (!iso) return '—';
  const t = new Date(iso).getTime();
  if (!t || isNaN(t)) return '—';
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 5) return '刚刚';
  if (s < 60) return s + ' 秒前';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
};
const syncText = (online, iso) => {
  const t = iso ? new Date(iso).getTime() : 0;
  const age = t ? (Date.now() - t) / 1000 : Infinity;
  if (!online) return '<span class="dot"></span>离线' + (t ? ' · 最后 ' + fmtAgo(iso) : '');
  if (age > 70) return '<span class="dot warn"></span>在线 · ' + fmtAgo(iso) + '同步（延迟偏大）';
  return '<span class="dot ok"></span>在线 · ' + fmtAgo(iso) + '同步';
};
/* 定时把「X 秒前」文案刷成最新，不重建页面（避免打断正在填写的表单） */
function updateSyncTexts() {
  document.querySelectorAll('.dev-sync').forEach((el) => {
    el.innerHTML = syncText(el.dataset.online === '1', el.dataset.ts || '');
  });
  document.querySelectorAll('.sync-tag').forEach((el) => {
    if (el.dataset.live === '1') return;
    el.innerHTML = syncText(el.dataset.online === '1', el.dataset.ts || '');
  });
}
setInterval(updateSyncTexts, 5000);

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sensorName = (k) => ({ radar: '雷达', mq: '燃气', sht: '温湿度', mic: '声敏', light: '光敏', battery: '电池', led: 'LED 灯', speaker: '喇叭' }[k] || k);
const stShort = (s) => ({ ok: '正常', err: '故障', warn: '异常', pass: '通过' }[s] || s);
const stText = (s) => ({ idle: '运行', run: '监测中', alert: '提醒', low_battery: '低电', ota: '升级中', unknown: '未知', offline: '离线', off: '已关机' }[s] || s);
const LV_CN = { info: '信息', warn: '提醒', err: '故障', critical: '严重', diag: '自检', ota: '升级', wifi: '网络', system: '系统', vol: '音量' };
const TYPE_CN = { gas_leak: '燃气泄漏', forgot_stove: '忘关火', low_battery: '低电', test_ok: '自检通过', self_test: '自检', power: '电源', boot: '开机', reboot: '重启', device: '设备', workflow: '工作流', vol: '音量' };
const ALL_SENSORS = [
  { k: 'radar', name: '雷达' }, { k: 'mq', name: '燃气' }, { k: 'sht', name: '温湿度' },
  { k: 'mic', name: '声敏' }, { k: 'light', name: '光敏' }, { k: 'battery', name: '电池' },
  { k: 'led', name: 'LED 灯' }, { k: 'speaker', name: '喇叭' }
];
const kv = (k, v) => '<div class="kv"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';

async function api(path, opt) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 12000); // 12 秒超时：避免网络半断时界面长时间无响应
  const headers = { 'Content-Type': 'application/json' };
  const tok = localStorage.getItem('xz_token') || '';
  if (tok) headers['X-Admin-Token'] = tok;
  try {
    const r = await fetch(path, Object.assign({ headers, signal: ctrl.signal }, opt));
    clearTimeout(t);
    if (r.status === 401) { localStorage.removeItem('xz_token'); showLoginPage('登录已失效，请重新登录'); throw new Error('未登录或登录已失效'); }
    return r.json();
  } catch (e) {
    clearTimeout(t);
    throw new Error('网络连接失败：服务器无响应（' + (e && e.name === 'AbortError' ? '请求超时' : (e && e.message ? e.message : '未知错误')) + '）');
  }
}

/* ================= 视图切换 ================= */
function setView(v) {
  view = v;
  document.querySelectorAll('.navbtn').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'devices') renderHome();
  else if (v === 'flash') { if (isMobileDevice()) { setView('devices'); return; } loadModels().finally(() => renderFlashPage()); }
  else if (v === 'wt') renderTestPage();
  else if (v === 'ai') renderAIPage();
  else if (v === 'debug') { if (isMobileDevice()) { setView('devices'); return; } renderDebugPage(); }
  else if (v === 'users') renderUsersPage();
  else if (v === 'insights') renderInsightsPage();
  else if (v === 'detail') {
    renderMain();
    // 详情页属于「全部设备」的功能延伸：保持顶部「全部设备」高亮
    const dbtn = document.querySelector('.navbtn[data-view="devices"]');
    if (dbtn) dbtn.classList.add('on');
  }
}
document.addEventListener('click', (e) => {
  const nb = e.target.closest('.navbtn');
  if (nb) setView(nb.dataset.view);
});

/* ================= 全部设备主页 ================= */
let lastDevicesKey = ''; // 首页防重绘：列表内容无变化时跳过 innerHTML 重建
async function loadDevices() {
  if (!me) return;   // 未登录不请求（登录页显示中）
  try {
    const data = await api('/api/devices');
    devices = data.devices || [];
  } catch {}
  if (view !== 'devices') return;
  // 只提取 devCard 实际展示的字段做比较；globalWfVersion 参与（影响 WF 徽标）
  const key = globalWfVersion + '|' + JSON.stringify(devices.map((d) => [
    d.id, d.name, d.devmode, d.state, d.online, d.lastSyncAt, d.battery, d.fw,
    d.workflowVersion, d.userName, d.deviceAddr, d.model, d.modelSrc
  ]));
  if (key !== lastDevicesKey) { lastDevicesKey = key; renderHome(); }
}

function renderHome() {
  const html =
    '<div class="page-head"><h2>全部设备</h2>' +
    '<button class="primary" id="btn-add">＋ 添加设备</button>' +
    '<span class="muted">共 ' + devices.length + ' 台 · 点击设备卡片进入管理（开发者模式/自检/OTA/参数语音）</span></div>' +
    '<div class="card" id="add-card" style="display:none"></div>' +
    (devices.length
      ? '<div class="home-grid">' + devices.map(devCard).join('') + '</div>'
      : '<div class="card"><div class="empty">暂无设备。请点击「添加设备」注册主机 ID，或先启动模拟器/烧录主机固件。</div></div>');
  $('#main').innerHTML = html;
  $('#btn-add').onclick = () => {
    const box = $('#add-card');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (box.style.display === 'block') {
      box.innerHTML =
        '<h3>添加设备（新主机入网登记）</h3>' +
        '<div class="fitem" style="margin:0 0 12px"><label><b>产品型号</b> <span style="color:var(--red)">*必选</span></label>' +
        '<select id="nd-model">' + modelOptionsRequired() + '</select></div>' +
        '<div class="frow"><div class="fitem"><label>设备 ID（可选）</label><input id="nd-id" placeholder="留空自动生成，如 A202610310001"></div>' +
        '<div class="fitem"><label>设备名称（可选）</label><input id="nd-name" placeholder="如 厨房主机"></div></div>' +
        '<div class="frow"><div class="fitem"><label>使用者姓名（可选）</label><input id="nd-user" placeholder="如 张阿姨"></div>' +
        '<div class="fitem"><label>联系电话（可选）</label><input id="nd-phone" placeholder="如 138****0000"></div></div>' +
        '<div class="fitem" style="margin:8px 0"><label>设备地址 / 备注</label><input id="nd-addr" placeholder="安装位置，如 武汉市××小区 3-1-502 厨房"></div>' +
        '<div class="row"><button class="primary" id="nd-ok">确认添加</button><button id="nd-cancel">取消</button></div>';
      $('#nd-ok').onclick = addDevice;
      $('#nd-cancel').onclick = () => { box.style.display = 'none'; };
    }
  };
  document.querySelectorAll('.dev').forEach((el) => el.onclick = () => select(el.dataset.id));
  // 电源控制：关机 / 重启 / 开机（真机执行，结果中文反馈）
  const POWER_CN = { poweroff: '关机', reboot: '重启', poweron: '开机' };
  document.querySelectorAll('.devop').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    const op = b.dataset.op; const id = b.closest('.dev').dataset.id;
    // 关机/重启会影响正在进行的检测与告警播报，二次确认
    if (op === 'poweroff' && !confirm('确认关机设备 ' + id + '？\n关机后主机停止检测与播报（仍保留远程监听，可随时开机）。')) return;
    if (op === 'reboot' && !confirm('确认重启设备 ' + id + '？\n配置会保留，重启期间短暂断线。')) return;
    b.disabled = true;
    const r = await api('/api/devices/' + id + '/power', { method: 'POST', body: JSON.stringify({ action: op }) }).catch(() => null);
    alert(r && r.ok ? (r.warn || '已下发「' + POWER_CN[op] + '」指令，主机执行后状态将自动更新') : (r && r.error ? r.error : '下发失败：服务未连接'));
    b.disabled = false;
    loadDevicesDebounced();
  });
}

function devCard(d) {
  const live = d.devmode ? ' <span class="badge live">开发者模式·实时</span>' : '';
  const st = d.state || 'unknown';
  const stCls = st === 'idle' ? 'state idle' : st === 'off' ? 'state off' : 'state';
  const wfBadge = (d.workflowVersion != null && globalWfVersion != null && Number(d.workflowVersion) !== globalWfVersion)
    ? ' <span class="badge" style="background:var(--amber-l);color:var(--amber)">WF 落后 v' + d.workflowVersion + '→v' + globalWfVersion + '</span>' : '';
  // 离线/已关机卡片视觉弱化：快速扫视即可分辨
  const dim = (!d.online || st === 'off') ? ' style="opacity:.62"' : '';
  return '<div class="dev" data-id="' + d.id + '"' + dim + '>' +
    '<div class="dev-top"><span class="dev-id">' + esc(d.id) + '</span>' +
    '<span class="dev-name">' + esc(d.name || '') + '</span></div>' +
    '<div class="dev-user"><span class="badge" style="background:' +
    (d.modelAvailable ? 'var(--blue-l)' : (d.modelName ? 'var(--amber-l)' : 'var(--red-l)')) + ';color:' +
    (d.modelAvailable ? 'var(--blue)' : (d.modelName ? 'var(--amber)' : 'var(--red)')) + '">' +
    (d.modelName ? esc(d.modelName) : '未设置型号') +
    (d.modelSrc === 'device' ? ' ·自动识别' : '') + '</span></div>' +
    ((d.userName || d.deviceAddr) ? '<div class="dev-user">' +
      (d.userName ? '<span>' + esc(d.userName) + '</span>' : '') +
      (d.deviceAddr ? '<span>' + esc(d.deviceAddr) + '</span>' : '') + '</div>' : '') +
    '<div class="dev-meta"><span class="badge ' + stCls + '">' + stText(st) + '</span>' +
    '<span class="badge">电量 ' + (d.battery != null ? d.battery + '%' : '—') + '</span>' +
    '<span class="badge">FW ' + (d.fw || '—') + '</span>' +
    (d.workflowVersion != null ? '<span class="badge">WF v' + d.workflowVersion + '</span>' : '') +
    live + wfBadge + '</div>' +
    '<div class="dev-sync" data-online="' + (d.online ? 1 : 0) + '" data-ts="' + esc(d.lastSyncAt || '') + '">' + syncText(d.online, d.lastSyncAt) + '</div>' +
    '<div class="dev-ops">' +
    '<button class="devop" data-op="poweroff">关机</button>' +
    '<button class="devop" data-op="reboot">重启</button>' +
    '<button class="devop" data-op="poweron">开机</button>' +
    '</div></div>';
}

async function addDevice() {
  const model = $('#nd-model').value;
  if (!model) { alert('请先选择产品型号（必选）'); $('#nd-model').focus(); return; }
  const id = $('#nd-id').value.trim();
  const name = $('#nd-name').value.trim();
  const userName = $('#nd-user').value.trim();
  const userPhone = $('#nd-phone').value.trim();
  const deviceAddr = $('#nd-addr').value.trim();
  const r = await api('/api/devices', { method: 'POST', body: JSON.stringify({ id: id || undefined, name, userName, userPhone, deviceAddr, note: deviceAddr, model }) }).catch(() => null);
  if (!r || !r.ok) { alert(r && r.error ? r.error : '添加失败：网络连接失败或服务器无响应'); return; }
  $('#add-card').style.display = 'none';
  loadDevices();
}

/* ================= 设备详情 ================= */
async function select(id) {
  selId = id;
  loadDevices();
  const data = await api('/api/devices/' + id);
  cur = data.device;
  if (!cur) { setView('devices'); return; }
  devmodeEnd = cur.devmodeUntil || 0;
  setView('detail');
}

function backToHome() { selId = null; cur = null; setView('devices'); }

/* 最近一次指令回执 / 升级中提示：设备回了 ack 必须有地方看得见，
   否则"后台显示下发成功、设备实际没执行"对用户就是黑箱 */
function ackLine(d) {
  if (d.otaGraceUntil && d.otaGraceUntil > Date.now()) {
    const left = Math.round((d.otaGraceUntil - Date.now()) / 1000);
    return '<div style="margin:8px 0;padding:8px 12px;border-radius:8px;background:#eef4ff;border:1px solid #c3d7f7;color:#1b4d8f;font-size:13px">' +
      '正在升级固件' + (d.otaTargetVersion ? ' → v' + esc(d.otaTargetVersion) : '') + '，主机重启期间不显示离线（剩余 ' + left + ' 秒宽限）</div>';
  }
  const a = d.lastAck;
  if (!a) return '';
  const when = a.at ? new Date(a.at).toLocaleTimeString('zh-CN', { hour12: false }) : '';
  return '<div style="margin:8px 0;padding:8px 12px;border-radius:8px;font-size:13px;background:' +
    (a.ok ? '#eefaf0' : '#fdecea') + ';border:1px solid ' + (a.ok ? '#b7e1c0' : '#f3b4b0') + ';color:' +
    (a.ok ? '#1a6b33' : '#8a1c14') + '">上次指令 <b>' + esc(a.cmd) + '</b> ' +
    (a.ok ? '执行成功' : '执行失败') + (a.detail ? '：' + esc(a.detail) : '') +
    (when ? '（' + when + '）' : '') + '</div>';
}

function renderMain() {
  const d = cur;
  const live = d.devmode;
  const online = d.online;
  const html =
    '<div class="topbar"><button id="btn-back">← 返回全部设备</button>' +
    '<h2>' + esc(d.id) + (d.name ? ' · ' + esc(d.name) : '') + '</h2>' +
    (d.modelName
      ? '<span class="ins-h ' + (d.modelAvailable ? 'good' : 'warn') + '" style="min-width:0">' + esc(d.modelName) + '</span>'
      : '<span class="ins-h bad" style="min-width:0">未设置型号</span>') +
    '<span class="sync-tag ' + (live ? 'live' : '') + '" data-live="' + (live ? 1 : 0) + '" data-online="' + (online ? 1 : 0) + '" data-ts="' + esc(d.lastSyncAt || '') + '">' +
    (live ? '<span class="dot live"></span>实时（开发者模式）' : syncText(online, d.lastSyncAt)) +
    '</span>' +
    '<button id="btn-edit">编辑信息</button>' +
    '<button class="danger" id="btn-del">删除设备</button></div>' +
    ackLine(d) +
    '<div class="card" id="edit-card" style="display:none"></div>' +
    (live ? devmodeBar(true) : devmodeBar(false)) +
    tabBar() +
    '<div id="tab-body">' + tabBody('overview') + '</div>';
  $('#main').innerHTML = html;

    const box = $('#edit-card');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (box.style.display === 'block') {
      box.innerHTML =

        '<div class="frow"><div class="fitem"><label>设备名称</label><input id="ed-name" value="' + esc(d.name || '') + '"></div>' +
        '<div class="fitem"><label>使用者姓名</label><input id="ed-user" value="' + esc(d.userName || '') + '"></div></div>' +
        '<div class="frow"><div class="fitem"><label>联系电话</label><input id="ed-phone" value="' + esc(d.userPhone || '') + '"></div>' +
        '<div class="fitem"><label>设备地址</label><input id="ed-addr" value="' + esc(d.deviceAddr || '') + '"></div></div>' +
        '<div class="frow"><div class="fitem"><label>设备型号</label>' +
        '<select id="ed-model">' + modelOptions(d.model) + '</select>' +
        '<div class="muted" style="font-size:12px;margin-top:4px">' +
        (d.modelSrc === 'device' ? '当前型号由主机上报自动识别' :
         (d.model ? '当前型号为人工设置' : '还没有型号，请选择')) +
        '；带「待开发」的型号暂不可选</div></div>' +
        '<div class="fitem"><label>MAC 地址</label><div class="muted" style="padding-top:7px;font-size:13px">' +
        (d.mac ? esc(d.mac) : '—（烧录登记后可见）') + '</div></div></div>' +
        '<div class="row"><button class="primary" id="ed-ok">保存修改</button><button id="ed-cancel">取消</button></div>';
      $('#ed-ok').onclick = async () => {
        const body = {
          name: $('#ed-name').value, userName: $('#ed-user').value.trim(),
          userPhone: $('#ed-phone').value.trim(), deviceAddr: $('#ed-addr').value.trim()
        };
        const r = await api('/api/devices/' + d.id, { method: 'PATCH', body: JSON.stringify(body) }).catch(() => null);
        if (!r || !r.ok) { alert(r && r.error ? r.error : '保存失败：网络连接失败或服务器无响应'); return; }
        const sel = $('#ed-model');
        if (sel && sel.value && sel.value !== d.model) {
          const mr = await api('/api/devices/' + d.id + '/model', { method: 'POST', body: JSON.stringify({ model: sel.value }) }).catch(() => null);
          if (!mr || !mr.ok) { alert(mr && mr.error ? mr.error : '型号保存失败'); return; }
        }
        box.style.display = 'none';
        select(d.id);
      };
      $('#ed-cancel').onclick = () => { box.style.display = 'none'; };
    }
  };
  $('#btn-del').onclick = async () => {
    if (!confirm('确认删除设备 ' + d.id + '？\n删除后该主机上报将被忽略（除非重新添加）。')) return;
    const r = await api('/api/devices/' + d.id, { method: 'DELETE' }).catch(() => null);
    if (!r || !r.ok) { alert(r && r.error ? r.error : '删除失败：网络连接失败或服务器无响应'); return; }
    backToHome();
  };
  bindTabs();
  if (live) startCountdown();
}

function bindTabs() {

function sensorHealthGrid(d) {
  const sh = d.sensorHealth || {};
  const s = (d.snapshot && d.snapshot.sensors) || {};
  const cells = ALL_SENSORS.map((it) => {
    const st = sh[it.k];
    const stCls = st === 'ok' ? 'ok' : st === 'warn' ? 'warn' : st === 'err' ? 'err' : '';
    const stTxt = st === 'ok' ? '正常' : st === 'warn' ? '异常' : st === 'err' ? '故障' : '待上报';
    let val = '—';
    if (it.k === 'battery') val = d.battery != null ? d.battery + '%' : '—';
    else if (it.k === 'led' || it.k === 'speaker') val = st ? (st === 'ok' ? '动作正常' : '—') : '待测试';
    else val = fmtSensor(it.k, s[it.k]);
    return '<div class="sensor-cell ' + stCls + '"><div class="s-name">' + it.name + '</div>' +
      '<div class="s-val">' + esc(String(val)) + '</div><div class="s-st">' + stTxt + '</div></div>';
  }).join('');
  return '<div class="sensor-grid">' + cells + '</div>';
}

/* ================= Tab 内容 ================= */
function tabBody(tab) {

      kv('当前状态', stText(d.state)) + kv('电量', d.battery != null ? d.battery + '%' : '—') +
      kv('固件版本', d.fw || '—') + kv('工作流版本', (d.workflowVersion != null ? 'v' + d.workflowVersion + (globalWfVersion != null && Number(d.workflowVersion) !== globalWfVersion ? '（落后，将自动补发 v' + globalWfVersion + '）' : '') : '—')) +
      kv('播报音量', d.volume != null ? d.volume + '%' : '—') + kv('设备添加时间', d.createdAt ? fmtTime(new Date(d.createdAt).toISOString()) : '—') +
      kv('使用者', d.userName || '—') + kv('联系电话', d.userPhone || '—') +
      kv('设备地址', d.deviceAddr || '—') + kv('在线状态', d.online ? '在线' : '离线') +
      kv('最后同步', fmtTime(d.lastSyncAt)) + kv('最后事件', d.lastEvent || '—') + '</div></div>' +
      '<div class="card"><h3>传感器健康</h3>' + sensorHealthGrid(d) + '</div>' +
      '<div class="card"><h3>最近事件</h3>' + eventList(evs) + '</div>';
  }
  if (tab === 'live') return liveTab();

function curEvents() {
  if (!cur || !cur.id) return [];
  return window.__eventsCache && window.__eventsCache[cur.id] ? window.__eventsCache[cur.id] : [];
}

function eventList(evs) {
  if (!evs.length) return '<div class="muted">暂无事件记录</div>';
  return '<ul class="events">' + evs.map((e) => {
    const lv = e.level || 'info';
    return '<li><span class="ev-lv ' + lv + '">' + (LV_CN[lv] || lv) + '</span><span>' + esc(e.text || '') + '</span><span class="ev-time">' + fmtTime(new Date(e.ts).toISOString()) + '</span></li>';
  }).join('') + '</ul>';
}

/* 实时 Tab */
function liveTab() {
  const live = cur.devmode;
  if (!live) {
    return '<div class="note">打开开发者模式后，这里会实时显示每项传感器的当前读数，主机将以高频采样持续上报。</div>' +
      '<button class="primary" id="dm-on2">打开开发者模式</button>';
  }
  const sensors = liveSensors(cur.snapshot);
  return '<div class="live-row">' + sensors.map((s) => '<div class="kv"><div class="k">' + esc(s.name) + '</div><div class="v" data-live="' + esc(s.key) + '">' + esc(String(s.val)) + '</div></div>').join('') + '</div>' +
    '<div class="muted" style="margin-top:8px">数据由主机高频实时上报，经 MQTT → WebSocket 实时刷新</div>';
}
function liveSensors(snap) {
  if (!snap) return [{ key: 'none', name: '暂无数据', val: '—' }];
  const s = snap.sensors || {};
  const out = [];
  ['radar','mq','sht','mic','light'].forEach((k) => out.push({ key: k, name: sensorName(k), val: fmtSensor(k, s[k]) }));
  out.push({ key: 'battery', name: '电池', val: snap.battery != null ? snap.battery + '%' : '—' });
  out.push({ key: 'state', name: '状态', val: stText(snap.state) });
  return out;
}
function fmtSensor(k, v) {
  if (k === 'sht') return v && v.t != null ? Number(v.t).toFixed(2) + '℃ / ' + Number(v.h).toFixed(2) + '%' : '—';
  if (k === 'radar') return v && v.presence != null ? (v.presence ? '有人 ' + esc(String(v.dist)) + 'cm' : '无人') : '—';
  if (k === 'mq') return v != null ? esc(String(v)) : '—';
  return v != null ? esc(String(v)) : '—';
}

/* 自检与故障 Tab */
let diagAnimating = false;
function startDiagProgress() {
  const box = $('#diag-progress');
  if (box) box.innerHTML = '<ul class="diag-progress">' + ALL_SENSORS.map((s) =>
    '<li><span class="dp-ic">○</span><span class="dp-name">' + s.name + '</span><span class="dp-val"></span></li>').join('') + '</ul>';
}
async function onDiagResult(data) {
  cur.lastDiag = data;
  const box = $('#diag-progress');
  try {
    if (box && (data.items || []).length) {
      diagAnimating = true;
      await animateDiag(box, data.items);
    }
  } finally { diagAnimating = false; } // 动画中断（切页/切设备）也复位锁，保证后续自检刷新不被卡死
  refreshDiag();
}
async function animateDiag(box, items) {
  if (!box) return;
  const total = Math.max(items.length, ALL_SENSORS.length);
  for (let i = 0; i < total; i++) {
    const li = box.children[i];
    if (li) { li.className = 'run'; const ic = li.querySelector('.dp-ic'); if (ic) ic.textContent = '…'; }
    await new Promise((r) => setTimeout(r, 280));
    const it = items[i];
    if (li) {
      if (it) {
        li.className = it.status === 'ok' ? 'ok' : it.status === 'warn' ? 'warn' : 'err';
        const ic = li.querySelector('.dp-ic'); if (ic) ic.textContent = it.status === 'ok' ? '✓' : it.status === 'warn' ? '△' : '✗';
        const nm = li.querySelector('.dp-name');
        const nmEl = ALL_SENSORS.find((x) => x.k === it.name);
        if (nm) nm.textContent = (nmEl ? nmEl.name : sensorName(it.name)) + (it.code ? '（' + it.code + '）' : '');
        const vl = li.querySelector('.dp-val');
        if (vl) vl.textContent = it.value != null ? ' · 读数 ' + esc(String(it.value)) : '';
      } else {
        li.className = 'ok'; const ic = li.querySelector('.dp-ic'); if (ic) ic.textContent = '✓';
      }
    }
  }
}
function diagTab() {
  const last = cur.lastDiag;
  let html = '<div class="card"><h3>传感器自检（全部 8 项：雷达/燃气/温湿度/声敏/光敏/电池/LED 灯/喇叭）</h3>' +

    '<button class="primary" id="diag-run">开始自检</button>' +
    '<div id="diag-progress"></div></div>';
  if (last) {
    const ps = last.problems || [];
    const items = last.items || [];
    html += '<div class="card"><h3>自检结果 · ' + (last.result === 'pass' ? '全部 8 项正常' : '发现 ' + ps.length + ' 项异常') + '</h3>' +
      (items.length ? '<ul class="diag-progress" style="margin-bottom:10px">' + items.map((i) => {
        const nm = ALL_SENSORS.find((x) => x.k === i.name);
        const stCls = i.status === 'ok' ? 'ok' : i.status === 'warn' ? 'warn' : 'err';
        const ic = i.status === 'ok' ? '✓' : i.status === 'warn' ? '△' : '✗';
        return '<li class="' + stCls + '"><span class="dp-ic">' + ic + '</span><span class="dp-name">' + (nm ? nm.name : sensorName(i.name)) + (i.code ? '（' + esc(String(i.code)) + '）' : '') + '</span><span class="dp-val">' + (i.value != null ? ' · 读数 ' + esc(String(i.value)) : '') + '</span></li>';
      }).join('') + '</ul>' : '') +
      (last.aiSummary ? '<div class="ai-box"><b>AI 综合分析：</b>' + esc(last.aiSummary) + '</div>' : '') +
      '<ul class="problist">' + (ps.length ? ps.map((p) => {
        return '<li class="' + (p.status === 'err' ? '' : 'pass') + '">' +
          '<div class="pb-head"><span>' + sensorName(p.name) + '</span><span class="code">' + p.code + '</span><span class="pb-sub">' + stShort(p.status) + (p.value != null ? ' · 读数 ' + p.value : '') + '</span></div>' +
          '<div class="pb-body"><b>原因：</b>' + esc(p.reason || '') + '</div>' +
          '<div class="pb-body"><b>可能原因：</b>' + (p.causes || []).join('；') + '</div>' +
          '<div class="pb-body"><b>排查建议：</b>' + esc(p.advice || '') + '</div></li>';
      }).join('') : '<li class="pass" style="border-left-color:var(--green)"><div class="pb-head">所有传感器测试通过</div></li>') + '</ul></div>';
  }
  return html;
}

/* ================= 有线调试（USB 直连电脑，真实读写主机） ================= */
// 原理：浏览器 WebSerial 直连 ESP32-C3 USB 串口（115200），按「有线调试协议」
// 收发 DBG 命令。固件实现在 firmware/esp32_backend_demo.ino（DBG:ping/info/
// sensors/status/diag/get/set/event/reset），应答为单行 JSON。所有数据来自真机串口，

const DBG_FAULT = {

  G2: { sensor: '燃气传感器 MQ', reason: '读数持续异常波动、无法稳定', causes: ['预热不足（3~5 分钟）', 'MQ 头老化', '升压 5V 抖动'], advice: '延长预热；检查 MT3608 输出；老化则更换' },

  M1: { sensor: '声敏传感器', reason: '无声音信号输出', causes: ['GPIO11 接线断开', '灵敏度电位器旋到最低'], advice: '检查 GPIO11；顺时针微调灵敏度电位器后重测' },
  L1: { sensor: '光敏传感器', reason: '光敏读数异常（恒 0 或恒满量程）', causes: ['GPIO1 分压断线', '引脚虚焊', '出光窗被遮挡'], advice: '检查 GPIO1 与分压电阻；确认 φ10 乳白出光窗未堵' },
  B1: { sensor: '电池', reason: '电量过低（电压采样 < 3.4V）', causes: ['18650 亏电', '充电未完成'], advice: '立即充电；低电期间仅保留燃气即时检测与提醒' },
  B2: { sensor: '电池', reason: '电压采样异常（恒 0 或恒满量程）', causes: ['10k/10k 分压断线', 'GPIO0 未接'], advice: '检查电池分压网络与 GPIO0 接线（3.7V 应读约 1.85V）' },
  S1: { sensor: '语音功放 MAX98357A', reason: 'I2S 输出异常（喇叭无声）', causes: ['喇叭接线断', '功放供电不足', 'GPIO15(SD) 未接对'], advice: '检查 GPIO12/13/14/15 与喇叭接线；确认功放供电与共地' }
};
const DBG_SENSOR_NAMES = { radar: '雷达', mq: '燃气', sht: '温湿度', mic: '声敏', light: '光敏', battery: '电池', led: 'LED 灯', speaker: '喇叭' };
let dbgPort = null, dbgReader = null, dbgWriter = null, dbgLineBuf = '', dbgTimer = null, dbgPollOn = false;
const dbgPend = [];

function dbgSend(cmd) {
  if (!dbgWriter) return Promise.reject(new Error('未连接 USB 串口，无法发送命令'));
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => { const i = dbgPend.indexOf(p); if (i >= 0) dbgPend.splice(i, 1); reject(new Error('命令超时：主机 5 秒内无应答，请确认选中的是主机串口且固件支持该命令（' + cmd + '）')); }, 5000);
    const p = { cmd, resolve: (r) => { clearTimeout(t); resolve(r); } };
    dbgPend.push(p);
    dbgWriter.write(cmd + '\n').catch((e) => {
      const i = dbgPend.indexOf(p); if (i >= 0) dbgPend.splice(i, 1); clearTimeout(t);
      const raw = e && e.message ? String(e.message) : String(e || '未知错误');
      reject(new Error('写入串口失败：' + (raw.includes('stream is locked') ? '串口流被占用（可能刚断开，请先点「断开」再重新连接）' : raw.replace(/^[^:：]*[：:]\s*/, ''))));
    });
  });
}

function dbgOnLine(raw) {
  let j = null;
  try { j = JSON.parse(raw); } catch { return; }
  if (!j || typeof j.dbg !== 'string') return;
  // 用「DBG:命令字」匹配应答：发送的是 "DBG:get volume"，固件应答 dbg 字段是 "get"，
  // 必须按命令字匹配，否则 get/set/wifi/event 等命令会永远超时。
  const idx = dbgPend.findIndex((p) => {
    const cmdKey = String(p.cmd).slice(4).split(' ')[0].trim(); // DBG:get volume → get
    return cmdKey === j.dbg || p.cmd === j.dbg;
  });
  if (idx >= 0) { const p = dbgPend.splice(idx, 1)[0]; p.resolve(j); }
  if (dbgPollOn && j.dbg === 'sensors' && view === 'debug') {
    const el = $('#dbg-sensors-body'); if (el) renderDbgSensors(j.sensors || {});
  }
}

function dbgSetStatus(phase, msg) {
  const el = $('#dbg-status');
  if (!el) return;
  const map = {
    idle: '<span class="dot"></span>未连接',
    connecting: '<span class="dot live"></span>连接中…',
    opened: '<span class="dot live"></span>' + (msg || 'USB 已打开，探测主机…'),
    connected: '<span class="dot live"></span>已连接：' + (msg || '正常'),
    error: '<span class="dot" style="background:var(--red)"></span>' + (msg || '连接失败')
  };
  el.innerHTML = map[phase] || msg;
}

function dbgOpenErr(e) {
  const name = e && e.name ? e.name : '';
  if (name === 'SecurityError') return '浏览器安全限制（需要 HTTPS 且由用户点击触发）';
  if (name === 'NetworkError') return '串口被占用或驱动异常（可能已被其他程序打开，关闭后重试）';
  if (name === 'InvalidStateError') return '串口已处于打开状态';
  if (name === 'NotFoundError') return '设备不存在或已被拔出';
  return (name ? name + '：' : '') + ((e && e.message) || '未知错误');
}

async function dbgConn() {
  if (!navigator.serial) { dbgSetStatus('error', '当前浏览器不支持 WebSerial：请用电脑端 Chrome/Edge（HTTPS）打开。'); return; }
  dbgSetStatus('connecting', '正在等待选择串口设备…');
  let port;
  try { port = await navigator.serial.requestPort(); }
  catch (e) {
    if (e && e.name === 'NotFoundError') dbgSetStatus('error', '未选择任何串口设备（已取消）。请点「连接 USB」后在系统弹窗中选择主机对应的串口。');
    else dbgSetStatus('error', '请求串口失败：' + dbgOpenErr(e));
    return;
  }
  try { await port.open({ baudRate: 115200 }); }
  catch (e) { dbgSetStatus('error', '打开串口失败：' + dbgOpenErr(e)); return; }
  dbgPort = port;
  dbgWriter = port.writable.getWriter();
  dbgReader = port.readable.getReader();
  const gi = (typeof port.getInfo === 'function') ? port.getInfo() : null;
  const usbDesc = (gi && (gi.usbVendorId || gi.usbProductId))
    ? '（USB VID:PID ' + gi.usbVendorId.toString(16) + ':' + gi.usbProductId.toString(16) + '）' : '';
  dbgSetStatus('opened', 'USB 已打开' + usbDesc + '，正在探测主机协议…');
  (async () => { // 读循环：真实检测串口数据；done/error 即断开
    const dec = new TextDecoder();
    let closed = false;
    while (!closed) {
      let value, done;
      try { ({ value, done } = await dbgReader.read()); } catch { closed = true; break; }
      if (done) { closed = true; break; }
      dbgLineBuf += dec.decode(value);
      let nl;
      while ((nl = dbgLineBuf.indexOf('\n')) >= 0) {
        const line = dbgLineBuf.slice(0, nl).replace(/\r$/, '');
        dbgLineBuf = dbgLineBuf.slice(nl + 1);
        if (line.trim()) dbgOnLine(line.trim());
      }
    }
    // 串口关闭/拔出：真实断开检测
    dbgPollOn = false; stopDbgPoll();
    dbgReader = null; try { dbgWriter && dbgWriter.release(); } catch {} dbgWriter = null;
    dbgPort = null;
    dbgSetStatus('error', 'USB 连接已断开（串口关闭或主机被拔出）');
  })();
  // 探测主机调试协议（真实应答）
  try {
    const ping = await dbgSend('DBG:ping');
    if (ping && ping.ok && ping.pong) {
      dbgSetStatus('connected', '主机已应答 · USB 链路正常');
      dbgPollOn = true; startDbgPoll();
      const info = await dbgSend('DBG:info').catch(() => null); if (info && info.ok) renderDbgInfo(info);
      const st = await dbgSend('DBG:status').catch(() => null); if (st && st.ok) renderDbgStatus(st);
      await dbgSend('DBG:event 20').catch(() => null);
      const vol = await dbgSend('DBG:get volume').catch(() => null);
      if (vol && vol.ok && $('#dbg-vol')) { $('#dbg-vol').value = vol.value; const vv = $('#dbg-vol-val'); if (vv) vv.textContent = vol.value; }
    } else {
      await dbgDisconn();
      dbgSetStatus('error', '串口已打开但主机无应答：可能选错了串口（不是主机）、固件未含 DBG 调试协议、或波特率不匹配（应为 115200）。');
    }
  } catch (e) {
    await dbgDisconn();
    dbgSetStatus('error', '探测主机失败：' + (e.message || e) + '（确认选择的是主机 USB 串口）');
  }
}

async function dbgDisconn() {
  dbgPollOn = false; stopDbgPoll();
  try { if (dbgReader) { await dbgReader.cancel(); dbgReader = null; } } catch {}
  try { if (dbgWriter) { dbgWriter.release(); dbgWriter = null; } } catch {}
  try { if (dbgPort) { await dbgPort.close(); dbgPort = null; } } catch {}
  dbgSetStatus('idle');
}

function startDbgPoll() {
  stopDbgPoll();
  dbgTimer = setInterval(() => { if (dbgPollOn && view === 'debug') dbgSend('DBG:sensors').catch(() => {}); }, 2000);
}
function stopDbgPoll() { if (dbgTimer) { clearInterval(dbgTimer); dbgTimer = null; } }

function renderDbgDiag(j) {
  const box = $('#dbg-diag-result');
  if (!box) return;
  const items = j.items || [];
  const bad = items.filter((i) => i.status !== 'ok');
  let html = '<div class="card"><h3>自检结果 · ' + (bad.length ? '发现 ' + bad.length + ' 项异常' : '全部 8 项正常') + '</h3>';
  if (items.length) html += '<ul class="diag-progress" style="margin-bottom:10px">' + items.map((i) => {
    const stCls = i.status === 'ok' ? 'ok' : i.status === 'warn' ? 'warn' : 'err';
    const ic = i.status === 'ok' ? '✓' : i.status === 'warn' ? '△' : '✗';
    return '<li class="' + stCls + '"><span class="dp-ic">' + ic + '</span><span class="dp-name">' + esc(DBG_SENSOR_NAMES[i.name] || String(i.name)) + (i.code ? '（' + esc(String(i.code)) + '）' : '') + '</span><span class="dp-val">' + (i.value != null ? ' · 读数 ' + esc(String(i.value)) : '') + '</span></li>';
  }).join('') + '</ul>';
  html += '<ul class="problist">';
  if (!bad.length) html += '<li class="pass" style="border-left-color:var(--green)"><div class="pb-head">所有传感器与执行部件测试通过</div></li>';
  bad.forEach((i) => {
    const f = DBG_FAULT[i.code] || {};
    html += '<li><div class="pb-head"><span>' + esc(DBG_SENSOR_NAMES[i.name] || String(i.name)) + '</span><span class="code">' + esc(i.code || '') + '</span><span class="pb-sub">' + stShort(i.status) + (i.value != null ? ' · 读数 ' + esc(String(i.value)) : '') + '</span></div>' +
      '<div class="pb-body"><b>原因：</b>' + esc(f.reason || i.detail || '未知') + '</div>' +
      (f.causes ? '<div class="pb-body"><b>可能原因：</b>' + esc(f.causes.join('；')) + '</div>' : '') +
      (f.advice ? '<div class="pb-body"><b>排查建议：</b>' + esc(f.advice) + '</div>' : '') + '</li>';
  });
  html += '</ul></div>';
  box.innerHTML = html;
}

function dbgTime(tsMs) {
  if (tsMs == null) return '';
  const s = Math.floor(tsMs / 1000);
  const m = Math.floor(s / 60), ss = s % 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}

    ? '<ul class="events">' + evs.map((e) => '<li><span class="ev-time">' + dbgTime(e.ts) + '</span><span class="ev-type">' + (TYPE_CN[e.type] || esc(e.type || '')) + '</span>' + esc(e.text || '') + '</li>').join('') + '</ul>'

}

  };

}

function wfForm(steps, ver) {
  return '<div id="wf-ver2" style="display:none">' + ver + '</div>' +
    steps.map((st) => {
      const params = Object.keys(st.params).map((k) => {
        const v = st.params[k];
        const val = typeof v === 'boolean'
          ? '<select id="wp-' + st.id + '-' + k + '"><option value="true"' + (v ? ' selected' : '') + '>是</option><option value="false"' + (!v ? ' selected' : '') + '>否</option></select>'
          : '<input type="number" id="wp-' + st.id + '-' + k + '" value="' + v + '">';
        return '<div class="fitem"><label>' + esc(paramLabel(k)) + '</label>' + val + '</div>';
      }).join('');
      return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px">' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<label style="display:flex;align-items:center;gap:5px;font-weight:600"><input type="checkbox" id="we-' + st.id + '"' + (st.enabled ? ' checked' : '') + '> ' + esc(st.name) + '</label>' +
        '<span class="chip">' + roleText(st.role) + '</span></div>' +
        '<div class="muted" style="margin:6px 0 8px">' + esc(st.desc) + '</div>' +
        '<div class="frow">' + params + '</div></div>';
    }).join('') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="primary" id="wf-save">保存工作流（版本 +1）</button>' +
    '<button id="wf-reset">恢复默认工作流</button>' +
    '<button class="primary" id="wf-push">一键推送到全部设备</button></div>' +
    '<div id="wf-msg" class="muted" style="margin-top:8px"></div>';
}
function paramLabel(k) {
  return { human_first:'先检测人体', light_min:'光线下限', light_max:'光线上限', temp_rise:'温升阈值℃', confirm_sec:'保持确认秒', require_all:'需全部满足', window_sec:'尖峰窗口秒', sigma:'σ倍数', check_rate:'用变化速率', mq_threshold_adc:'MQ阈值', only_non_cooking:'仅非做饭态', exclude_sec:'排除窗口秒', humidity_rise:'湿度上升%', remind_interval_sec:'提醒间隔秒', timeout_sec:'无人超时秒', remind_times:'循环次数', voice_level:'播报级别', threshold_abs:'绝对温度℃', rise_c:'温升阈值℃', daily_profile:'每日建档', update_idle_only:'仅空闲更新', window_hours:'建档窗口小时' }[k] || k;
}
function roleText(r) { return { trigger:'触发', exclude:'排除', fallback:'兜底' }[r] || r; }

function collectWf() {
  return settingsCache.workflow.map((st) => {
    const params = {};
    Object.keys(st.params).forEach((k) => {
      const el = $('#wp-' + st.id + '-' + k);
      if (!el) return;
      if (typeof st.params[k] === 'boolean') { params[k] = el.value === 'true'; return; }
      if (el.value === '') { params[k] = st.params[k]; return; } // 留空 = 不修改该项，保留原值
      const n = Number(el.value);
      params[k] = isNaN(n) ? st.params[k] : n; // 非数字 = 保留原值，防止 NaN 入库
    });
    const en = $('#we-' + st.id);
    return { id: st.id, enabled: en ? en.checked : st.enabled, params };
  });
}

function bindAiActions() {
  const save = $('#ai-save'); if (save) save.onclick = async () => {
    const t = Number($('#ai-temp').value), to = Number($('#ai-timeout').value);
    if (isNaN(t) || isNaN(to)) { $('#ai-msg').textContent = '温度与超时时间请输入数字后再保存'; return; }
    const cfg = {
      enabled: $('#ai-enabled').value === 'true',
      endpoint: $('#ai-endpoint').value.trim(),
      apiKey: $('#ai-key').value.trim(),
      model: $('#ai-model').value.trim(),
      temperature: t,

/* 程序烧录页的 ④ OTA：进入即自动生成链接，切换固件重新生成，下发前校验 */
async function bindFlashOta() {
  const fwSel = $('#of-fw'), urlEl = $('#of-url'), verEl = $('#of-ver'), msg = $('#of-msg');
  if (!fwSel || !urlEl) return;
  const fill = async () => {
    const opt = fwSel.selectedOptions[0];
    if (!opt || !opt.value) {
      urlEl.value = '';
      if (msg) msg.textContent = '固件库为空：请先在 ① 上传固件。';
      return;
    }
    verEl.value = opt.dataset.ver || '';
    if (msg) msg.textContent = '正在生成下载链接…';
    const L = await fwLinkFor(opt.value);
    if (!L) {
      urlEl.value = '';
      if (msg) msg.textContent = '链接生成失败（服务未连接或登录失效），请重新选择固件重试。';
      return;
    }
    urlEl.value = L.url;
    if (msg) {
      const min = Math.max(1, Math.round((L.expiresAt - Date.now()) / 60000));
      msg.textContent = '已自动生成下载链接，' + min + ' 分钟内有效（下发时后台会重新签发同期限地址）。';
    }
  };
  fwSel.onchange = fill;
  const btn = $('#of-send');
  if (btn) btn.onclick = async () => {
    const devSel = $('#of-dev');
    const device = devSel ? devSel.value : '';
    if (!device) { alert('请先选择要升级的主机'); return; }
    if (!urlEl.value.trim()) await fill();
    const url = urlEl.value.trim(), version = verEl.value.trim();
    if (!url) { alert('下载链接没生成成功，无法下发。请检查固件库与登录状态。'); return; }
    if (!version) { alert('请填写目标版本号'); return; }
    const dev = devices.find((x) => x.id === device);
    if (dev && !dev.online && !confirm('主机 ' + device + ' 当前离线，OTA 指令会下发失败或等到下次上线才执行。仍要下发吗？')) return;
    btn.disabled = true;
    const fwId = fwSel.value;
    const r = await api('/api/devices/' + encodeURIComponent(device) + '/ota', { method: 'POST', body: JSON.stringify({ firmwareId: fwId, version }) }).catch(() => null);
    btn.disabled = false;
    if (r && r.ok) {
      if (msg) msg.textContent = '已下发：' + device + ' → v' + version + (r.warn ? '（' + r.warn + '）' : '');
      alert(r.warn || ('OTA 指令已下发：' + device + ' → v' + version + '\n主机重启后会自己上报新版本号。'));
    } else {
      const err = r && r.error ? r.error : '服务未连接或服务器无响应';
      if (msg) msg.textContent = '下发失败：' + err;
      alert('下发失败：' + err);
    }
  };
  if (!devices.length) {
    const r = await api('/api/devices').catch(() => null);
    if (r && r.devices) {
      devices = r.devices;
      const dsel = $('#of-dev'); if (dsel) dsel.innerHTML = devSelectOptions();
    }
  }
  fill();
}

/** 按平台收掉手机上没有意义的功能（CSS 与 DOM 双保险，不依赖执行时机） */

function fmtSize(n) {
  if (!n) return '0B';
  if (n > 1048576) return (n / 1048576).toFixed(1) + 'MB';
  if (n > 1024) return (n / 1024).toFixed(1) + 'KB';
  return n + 'B';
}

async function uploadFirmware() {
  const file = $('#fw-file').files[0];
  const version = $('#fw-ver').value.trim() || '0.0.0';
  const note = $('#fw-note').value.trim();
  if (!file) { $('#fw-msg').textContent = '请先选择 .bin 固件文件'; return; }

    const headers = { 'Content-Type': 'application/octet-stream', 'X-Fw-Name': file.name.replace(/\.bin$/i, ''), 'X-Fw-Version': version, 'X-Fw-Note': note };
    const tok = localStorage.getItem('xz_admin_token') || '';

      method: 'POST',

// 预检：115200 打开串口 → 发 DBG:ping/info 探测是否为小知了厨房卫士主机
async function probeDbgOnPort(port) {
  const enc = new TextEncoder();
  let w = null, r = null;
  try {
    w = port.writable.getWriter();
    await w.write(enc.encode('DBG:ping\n'));
    w.releaseLock(); w = null;
    r = port.readable.getReader();
    let buf = '';
    const deadline = Date.now() + 3000;
    while (Date.now() < deadline) {
      const { value, done } = await r.read();
      if (done) break;
      buf += new TextDecoder().decode(value);
      const line = buf.split('\n').find((l) => l.indexOf('pong') >= 0);
      if (line) { r.releaseLock(); r = null; return true; }
    }
  } catch (e) { try { if (w) w.releaseLock(); } catch (_) {} }
  try { if (r) { await r.cancel(); r.releaseLock(); } } catch (_) {}
  return false;
}
async function readDbgInfo(port, timeoutMs) {
  // 发 info 并读取一整行 JSON（timeoutMs 内）
  const enc = new TextEncoder();
  const w = port.writable.getWriter();
  await w.write(enc.encode('DBG:info\n'));
  w.releaseLock();
  const r = port.readable.getReader();
  let buf = '';
  const deadline = Date.now() + (timeoutMs || 2500);
  try {
    while (Date.now() < deadline) {
      const { value, done } = await r.read();
      if (done) break;
      buf += new TextDecoder().decode(value);
      const nl = buf.indexOf('\n');
      if (nl >= 0) {
        const line = buf.slice(0, nl).trim();
        if (line.startsWith('{')) { r.releaseLock(); try { const j = JSON.parse(line); return j; } catch { return null; } }
      }
    }
  } catch (e) {}
  try { await r.cancel(); } catch (_) {}
  return null;
}
async function connectPort() {
  if (!navigator.serial) { flLog('✗ 当前浏览器不支持 WebSerial。请使用 Chrome 或 Edge（桌面版），并确保页面是 HTTPS。'); return; }
  const btn = $('#fl-connect');
  if (btn) { btn.disabled = true; btn.textContent = '连接中…'; }
  try {
    await doConnectPort();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '连接设备（选串口）'; }
  }
}
async function doConnectPort() {
  const baud = Number($('#fl-baud') ? $('#fl-baud').value : 921600) || 921600;
  let port = null;
  try {
    // 第一步：选择串口并识别 USB 芯片
    port = await navigator.serial.requestPort();
    const info = (port.getInfo && typeof port.getInfo === 'function') ? port.getInfo() : {};
    const vid = ((info.usbVendorId || 0) & 0xffff).toString(16).padStart(4, '0');
    const pid = ((info.usbProductId || 0) & 0xffff).toString(16).padStart(4, '0');
    const usbKey = vid + ':' + pid;
    const chipName = SUPPORTED_USB[usbKey];
    flLog('① 串口芯片识别：' + (chipName ? ('识别为「' + chipName + '」（VID:PID ' + usbKey + '）') : ('未知芯片（VID:PID ' + usbKey + '）')));
    if (!chipName) {
      flLog('✗ 未识别到本设计支持的串口芯片（支持：CP210x / CH340 / CH341 / CH9102 / ESP32 原生 USB）。');
      flLog('  请检查：数据线是否损坏、驱动是否安装、是否选错了串口。为保护设备，已拒绝进入烧录。');
      try { await port.close(); } catch (_) {}
      return;
    }
    // 第二步：115200 探测 DBG 调试协议（小知了厨房卫士主机固件标识）
    await port.open({ baudRate: 115200 });
    flLog('② 正在探测主机固件（DBG 调试协议，115200）…');
    const ok = await probeDbgOnPort(port);
    if (!ok) {
      flLog('② DBG 协议无应答 —— 这台很可能是空白主机（焊好但还没烧过固件）。');
      flLog('   正在做芯片级识别（读芯片型号 + MAC，约需数秒）…');
      const blank = await detectBlankChip(port);
      if (blank) {
        flLog('✓ 已识别到芯片：' + blank.chip + (blank.mac ? (' · MAC ' + blank.mac) : '（MAC 读取失败）'));
        flLog('   这是未初始化主机：没有固件、也没有设备 ID。下面填写型号后登记，再烧录即可上线。');
        renderBlankDevice(blank);
      } else {
        flLog('✗ 芯片级识别同样失败。可能不是 ESP32 设备、选错了串口，或数据线/驱动有问题。');
        flLog('  为保护设备，已拒绝进入烧录。请确认后重试。');
      }
      try { await port.close(); } catch (_) {}
      return;
    }
    const infoJ = await readDbgInfo(port);
    if (infoJ && infoJ.ok) {
      flashProbe = infoJ;
      flLog('③ 已识别设备：');
      flLog('   设备 ID：' + (infoJ.id || '—'));
      flLog('   固件版本：' + (infoJ.fw || '—') + ' · 芯片：' + (infoJ.chip || '—'));
      flLog('   运行时长：' + (infoJ.uptimeSec != null ? Math.round(infoJ.uptimeSec / 60) + ' 分钟' : '—') + ' · 工作流：' + (infoJ.workflowVersion ? 'v' + infoJ.workflowVersion : '未设置'));
      flLog('✓ 确认为小知了厨房卫士主机，支持烧录。正在建立烧录通道…');
    } else {
      flLog('! 已探测到 DBG 协议但 info 读取异常，按本设计设备继续（芯片 ' + chipName + '）。');
    }
    try { await port.close(); } catch (_) {}
    // 第三步：正式烧录通道（esptool，目标波特率）
    const { ESPLoader, Transport } = await import('/vendor/esptool-js/bundle.js');
    await port.open({ baudRate: baud });
    const transport = new Transport(port, true);
    const loader = new ESPLoader({
      transport,
      baudrate: baud,
      terminal: { clean() {}, write(d) { flLog(String(d)); }, onLine(l) { flLog(String(l)); } },
      debug: false
    });
    await loader.main('default_reset');
    flLog('✓ 烧录通道已建立（波特率 ' + baud + '），检测到芯片：' + loader.chip + '（' + loader.flashSize + '）');
    flashPort = port; flashLoader = loader;
    $('#fl-burn').disabled = false;
    $('#fl-connect').textContent = '已连接 ' + loader.chip + '（可重新选择）';
  } catch (e) {
    if (port) { try { await port.close(); } catch (_) {} }
    const msg = String(e && e.message || e);
    flLog('✗ 连接失败：' + (msg.indexOf('cancel') >= 0 ? '你取消了选择串口' : msg));
  }
}
/**
 * 芯片级识别：空白主机没固件、DBG 不应答，但 ESP32 的 ROM 引导总会应答 esptool。
 * 读到芯片型号和 MAC 就能证明「这是一台真实的空白主机」，而不是选错了串口。
 */
async function detectBlankChip(port) {
  let transport = null;
  try {
    try { if (port.readable || port.writable) await port.close(); } catch (_) {}
    await port.open({ baudRate: 115200 });
    const { ESPLoader, Transport } = await import('/vendor/esptool-js/bundle.js');
    transport = new Transport(port, true);
    const loader = new ESPLoader({
      transport, baudrate: 115200,
      terminal: { clean() {}, write() {}, onLine() {} }, debug: false
    });
    await loader.main('default_reset');
    let mac = '';
    try { mac = await loader.readMac(true); } catch (_) { mac = ''; }
    const chip = loader.chip || '未知芯片';
    try { await transport.disconnect(); } catch (_) {}
    return { chip: String(chip), mac: String(mac || '').toUpperCase() };
  } catch (e) {
    try { if (transport) await transport.disconnect(); } catch (_) {}
    return null;
  }
}

async function burnFirmware() {
  const fwId = $('#fl-fw').value;
  if (!fwId) { flLog('✗ 请先在固件库上传/选择一个固件'); return; }
  const fw = firmwares.find((f) => f.id === fwId);
  if (!fw) return;
  if (!flashLoader) { flLog('✗ 请先点击「连接设备」'); return; }
  const flashSize = $('#fl-size').value;
  flLog('→ 下载固件 ' + fw.name + ' v' + fw.version + '（' + fmtSize(fw.size) + '）…');
  try {
    const r = await fetch('/api/firmwares/' + fwId + '/download', { headers: { 'X-Admin-Token': localStorage.getItem('xz_token') || '' } });
    if (!r.ok) throw new Error('固件下载失败（HTTP ' + r.status + '），请重新登录后再试');
    const buf = await r.arrayBuffer();
    const data = new Uint8Array(buf);
    flLog('→ 已载入 ' + data.length + ' 字节，开始擦除并写入（地址 0x00000，Flash ' + flashSize + '）…');
    $('#fl-burn').disabled = true;
    await flashLoader.writeFlash({ fileArray: [{ data, address: 0x0 }], flashSize, eraseAll: true, compress: true });
    flLog('✓ 写入完成！正在硬复位…');
    await flashLoader.after('hard_reset');
    flLog('✓ 烧录成功，设备已重启。可断开 USB，或在“全部设备”中等待该设备上线（如需重新烧录可再次连接）。');
    $('#fl-burn').disabled = false; // 成功后允许再次连接重烧
    if (flashPort) { try { await flashPort.close(); } catch (_) {} flashPort = null; }
  } catch (e) {
    flLog('✗ 烧录失败：' + e.message);
    flLog('  恢复方法：重新点击「连接设备」→ 选择同一串口 → 再次「开始烧录」。ESP32 内置 ROM 引导，中断不影响芯片本身。');
    $('#fl-burn').disabled = false;
  }
}

/* 取固件签名下载链接（设备端无登录态，必须用带过期签名的地址） */
async function fwLinkFor(fwId) {
  if (!fwId) return null;
  const r = await api('/api/firmwares/' + fwId + '/link').catch(() => null);
  if (!r || !r.ok || !r.url) return null;
  return { url: location.origin + r.url, expiresAt: Number(r.expiresAt) || 0 };
}

/* 自动填充 OTA 表单：URL 由后台签发，版本号从固件库带出 */
async function otaFillLink(force) {
  const sel = $('#ota-fw');
  const urlEl = $('#ota-url'), verEl = $('#ota-ver'), msg = $('#ota-link-msg');
  if (!sel || !urlEl) return;
  const opt = sel.selectedOptions[0];
  if (!opt || !opt.value) {
    urlEl.value = '';
    if (msg) msg.textContent = '固件库为空：请先到「程序烧录」页上传固件，再回这里选择。';
    return;
  }
  if (!force && urlEl.value) return;
  verEl.value = opt.dataset.ver || '';
  if (msg) msg.textContent = '正在生成下载链接…';
  const L = await fwLinkFor(opt.value);
  if (!L) {
    urlEl.value = '';
    if (msg) msg.textContent = '链接生成失败（服务未连接或登录已失效），请点「重新生成链接」重试。';
    return;
  }
  urlEl.value = L.url;
  if (msg) {
    const min = Math.max(1, Math.round((L.expiresAt - Date.now()) / 60000));
    msg.textContent = '已自动生成下载链接（' + min + ' 分钟有效）；实际下发时后台会再签发同期限地址给主机下载。';
  }
}

async function setDevMode(on) {

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    const el = $('#dm-cd');
    if (!el) { clearInterval(countdownTimer); countdownTimer = null; return; }
    if (Date.now() >= devmodeEnd) { setDevMode(false); return; }
    el.textContent = fmtCount(devmodeEnd);
  }, 1000);
}

/* ================= WebSocket 实时 ================= */
let ldTimer = null;
function loadDevicesDebounced() {
  if (ldTimer) clearTimeout(ldTimer);
  ldTimer = setTimeout(loadDevices, 400);
}
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws?token=' + encodeURIComponent(localStorage.getItem('xz_token') || ''));
  ws.onopen = () => setPill('wss', true);
  ws.onclose = () => { setPill('wss', false); setTimeout(connectWS, 3000); };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'device_update') {
      if (m.device === selId && view === 'detail') {
        const d = m.data;
        if (cur) {
          cur.online = d.online; cur.lastSyncAt = d.lastSyncAt; cur.state = d.state;
          cur.battery = d.battery; cur.fw = d.fw; cur.sensorHealth = d.sensorHealth;
          cur.lastEvent = d.lastEvent; cur.snapshot = d.snapshot;
        }
        // 顶部状态栏（同步时间/离线/实时模式）在所有 tab 下实时更新；开发者模式样式一并保留
        const st = $('.sync-tag');
        if (st) {
          st.dataset.online = d.online ? '1' : '0';
          st.dataset.ts = d.lastSyncAt || '';
          st.dataset.live = (cur && cur.devmode) ? '1' : '0';
          st.innerHTML = (cur && cur.devmode) ? '<span class="dot live"></span>实时（开发者模式）' : syncText(d.online, d.lastSyncAt);
        }
        // 按当前 tab 局部刷新：只读 tab 更新内容；可编辑 tab（参数/语音/WiFi/OTA/自检）不重建页面，
        // 避免设备心跳把用户正在填写的表单清空并踢回概览页（输入完整保留）
        const t = curTab();
        if (t === 'overview') refreshOverview();
        else if (t === 'live') refreshLive();
        else if (t === 'events') refreshEvents();
        // 其余 tab 不重建：数据已更新到 cur，表单输入保留
      }
      loadDevicesDebounced();
    }
    if (m.type === 'devices_sync') loadDevicesDebounced();
    if (m.type === 'live' && m.device === selId && cur && cur.devmode && view === 'detail') {
      cur.snapshot = m.data;
      refreshLive();
    }
    if (m.type === 'diag' && m.device === selId && view === 'detail') {
      onDiagResult(m.data);
    }
    if (m.type === 'diag_ai' && m.device === selId && view === 'detail') {
      if (cur.lastDiag) cur.lastDiag.aiSummary = m.data.summary;
      refreshDiag();
    }
    if (m.type === 'event' && m.device === selId && view === 'detail') {
      if (!window.__eventsCache) window.__eventsCache = {};
      if (!window.__eventsCache[selId]) window.__eventsCache[selId] = [];
      window.__eventsCache[selId].push(m.data);
      window.__eventsCache[selId] = window.__eventsCache[selId].slice(-30);
      refreshEvents();
    }
    if (m.type === 'devmode' && m.device === selId && view === 'detail') {
      if (!m.data.on) { devmodeEnd = 0; loadDevices(); }
    }
    if (m.type === 'settings_update' && view === 'ai') {
      settingsCache = null;
    }
  };
}

    '</div>';

    const account = acc.value.trim(), password = pwd.value;
    const msgEl = document.getElementById('login-msg');
    if (!account || !password) { msgEl.textContent = '请输入账号和密码'; return; }
    msgEl.textContent = '登录中…';
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ account, password }) });
      const j = await r.json();
      if (r.ok && j.ok) {
        localStorage.setItem('xz_token', j.token);
        localStorage.setItem('xz_last_acc', account);

function changePwdModal(account, isSelf) {
  if (document.getElementById('pwd-modal')) return;

  modal.id = 'pwd-modal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(20,25,40,.55);display:flex;align-items:center;justify-content:center;';

    '<div class="lr"><label>新密码</label><input id="pwd-new" type="password" placeholder="6~64 位"></div>' +

    '</div>';

  document.getElementById('pwd-ok').onclick = async () => {
    const newPwd = document.getElementById('pwd-new').value;
    const msgEl = document.getElementById('pwd-msg');
    if (newPwd.length < 6 || newPwd.length > 64) { msgEl.textContent = '新密码需 6~64 位'; return; }
    msgEl.textContent = '提交中…';
    try {
      let r;
      if (isSelf) {
        const oldPwd = document.getElementById('pwd-old').value;
        r = await api('/api/auth/password', { method: 'POST', body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd }) });
        if (r && r.error) { msgEl.textContent = r.error; return; }
        close();
        alert('密码已修改，请重新登录');
        localStorage.removeItem('xz_token');
        location.reload();
        return;
      }
      r = await api('/api/users/' + encodeURIComponent(account), { method: 'PATCH', body: JSON.stringify({ password: newPwd }) });

      close();

    } catch (e) { msgEl.textContent = e.message; }
  };
  document.getElementById('pwd-new').focus();
}

const insState = { model: '', days: 7, data: null, sug: null, charts: {}, lib: null, detailId: null };

function insEcharts() {
  if (window.__insEchartsPromise) return window.__insEchartsPromise;
  window.__insEchartsPromise = new Promise((resolve, reject) => {
    if (window.echarts) return resolve(window.echarts);
    const sc = document.createElement('script');
    sc.src = 'https://fastly.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js';
    sc.onload = () => (window.echarts ? resolve(window.echarts) : reject(new Error('echarts 未就绪')));
    sc.onerror = () => reject(new Error('图表库加载失败'));
    document.head.appendChild(sc);
  });
  return window.__insEchartsPromise;
}

function insDisposeCharts() {
  Object.keys(insState.charts).forEach((k) => {
    try { insState.charts[k].dispose(); } catch (e) {}
    delete insState.charts[k];
  });
}

function fmtDur(sec) {
  const s0 = Math.max(0, Math.round(sec || 0));
  if (s0 < 60) return s0 + ' 秒';
  const m = Math.floor(s0 / 60);
  if (m < 60) return m + ' 分钟';
  return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
}

/** 做饭统计：数据全部来自主机上报的「开始/结束做饭」「有人/离开厨房」状态迁移 */
function drawInsCooking() {
  const box = $('#ins-cooking');
  if (!box) return;

  const head = '<div class="card"><h2 style="margin:0 0 4px;font-size:15px">做饭与离厨情况</h2>';
  const tip = '<p class="muted" style="margin:0 0 10px;font-size:12.5px">' +
    '来自主机上报的状态变化（开始做饭 / 结束做饭 / 离开厨房 / 回到厨房），不做推测。' +
    '主机每 20 秒上传一次场景快照，状态一变即记一条。</p>';

  if (!n) {
    box.innerHTML = head + tip +
      '<div class="empty">这段时间还没采集到做饭记录。<br>' +

  const kpis = '<div class="ins-kpis">' +

    insKpi('期间离厨', c.cookAwayCount, '次', c.cookAwayCount ? 'var(--red)' : 'var(--sub)') +
    insKpi('离厨累计', fmtDur(c.cookAwayTotalSec)) +
    insKpi('离厨最长', fmtDur(c.cookAwayLongestSec)) +
    insKpi('最近一次', c.cookLastAt ? fmtLocal(c.cookLastAt).slice(5, 16) : '—') +
    '</div>';

  const log = (c.cookLog || []).length ? (
    '<div class="ins-tablewrap" style="margin-top:10px"><table class="ins-table">' +

      '<td>' + (x.awaySec ? fmtDur(x.awaySec) : '—') + '</td>' +
      '<td>' + (x.ongoing ? '<span style="color:var(--orange,#d97706)">进行中</span>' : '已结束') + '</td></tr>').join('') +
    '</tbody></table></div></div>'
  ) : head + tip + '</div>';

  box.innerHTML = head + tip + kpis + log;

          label: { show: false }, itemStyle: { borderColor: '#fff', borderWidth: 2 },
          data: list.length ? list.map((x) => ({ name: x.label, value: x.count }))
                            : [{ name: '暂无可统计事件', value: 1 }],
        }],
      });
    }

    const hourEl = $('#ins-c-hour');
    if (hourEl) {
      insState.charts.hour = echarts.init(hourEl);
      const peak = d.byHour.reduce((a, b) => (b.count > a.count ? b : a), d.byHour[0] || { hour: 0, count: 0 });
      insState.charts.hour.setOption({
        grid: { left: 34, right: 8, top: 14, bottom: 24 },
        tooltip: { trigger: 'axis', formatter: (p) => p[0].axisValue + ' 点 · ' + p[0].value + ' 条' },
        xAxis: { type: 'category', data: d.byHour.map((x) => x.hour), ...axis, axisLabel: { color: '#646A73', fontSize: 10, interval: 3 } },
        yAxis: { type: 'value', ...axis, minInterval: 1 },
        series: [{
          type: 'bar', barMaxWidth: 12, data: d.byHour.map((x) => ({
            value: x.count,
            itemStyle: { color: x.hour === peak.hour && peak.count > 0 ? '#2F6FE4' : '#A9C0EC', borderRadius: [3, 3, 0, 0] },
          })),
        }],
      });
    }

    const weekEl = $('#ins-c-week');
    if (weekEl) {
      insState.charts.week = echarts.init(weekEl);
      insState.charts.week.setOption({
        grid: { left: 30, right: 8, top: 14, bottom: 24 },
        tooltip: { trigger: 'axis', formatter: (p) => p[0].axisValue + ' · ' + p[0].value + ' 条' },
        xAxis: { type: 'category', data: d.byWeekday.map((x) => x.label), ...axis, axisLabel: { color: '#646A73', fontSize: 11 } },
        yAxis: { type: 'value', ...axis, minInterval: 1 },
        series: [{ type: 'bar', barMaxWidth: 18, data: d.byWeekday.map((x) => ({
          value: x.count, itemStyle: { color: '#16A34A', borderRadius: [3, 3, 0, 0] } })),
        }],
      });
    }

    const alarmEl = $('#ins-c-alarm');
    if (alarmEl) {
      if (!d.alarmTotal) {
        alarmEl.innerHTML = '<div class="empty" style="padding-top:70px">该范围内没有报警事件</div>';
      } else {
        insState.charts.alarm = echarts.init(alarmEl);
        insState.charts.alarm.setOption({
          grid: { left: 34, right: 8, top: 14, bottom: 24 },
          tooltip: { trigger: 'axis', formatter: (p) => p[0].axisValue + ' 点 · ' + p[0].value + ' 次' },
          xAxis: { type: 'category', data: d.alarmByHour.map((x) => x.hour), ...axis, axisLabel: { color: '#646A73', fontSize: 10, interval: 3 } },
          yAxis: { type: 'value', ...axis, minInterval: 1 },
          series: [{ type: 'bar', barMaxWidth: 12, data: d.alarmByHour.map((x) => ({
            value: x.count, itemStyle: { color: '#DC2626', borderRadius: [3, 3, 0, 0] } })),
